name: Test and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Server and bot tests
        # test_advanced_joystick.py is a manual Playwright script for a real browser, not part of CI
        run: python -m pytest -q tests --ignore=tests/test_advanced_joystick.py
      - name: Client tests
        run: node tests/test_match_end.mjs && node tests/test_rollback_state.mjs

  pages:
    name: Deploy Game to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Collect the public files
        # Only the game, the docs and the root redirect are published
        run: |
          mkdir _site
          cp -r index.html player docs _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  vps:
    name: Deploy to VPS
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            SUDO=""
            if command -v sudo >/dev/null 2>&1 && [ "$USER" != "root" ]; then
              SUDO="sudo"
            fi

            health() {
              curl -s --max-time 2 http://127.0.0.1:8080/api/health || true
            }

            echo "=== 0. Waiting for live matches to finish (up to 3 minutes) ==="
            # Restarting the server ends every match in progress, so let running fights finish first
            for i in $(seq 1 36); do
              ACTIVE=$(health | python3 -c "import sys, json; print(json.load(sys.stdin).get('active_matches', 0))" 2>/dev/null || echo 0)
              if [ "$ACTIVE" = "0" ]; then break; fi
              echo "  ${ACTIVE} match(es) in progress, waiting..."
              sleep 5
            done

            echo "=== 1. Ensuring target directory exists ==="
            $SUDO mkdir -p /var/www/umk3/data
            # Everything but data/, which belongs to the service user (it holds the live database)
            $SUDO find /var/www/umk3 -path /var/www/umk3/data -prune -o -exec chown $USER:$USER {} +

            echo "=== 2. Pulling latest code ==="
            if [ -d "/var/www/umk3/.git" ]; then
              cd /var/www/umk3
              git fetch origin main || git fetch origin master
              git reset --hard origin/main || git reset --hard origin/master
            else
              git clone https://github.com/JavohirX/umk3 /tmp/umk3_clone
              cp -a /tmp/umk3_clone/. /var/www/umk3/
              rm -rf /tmp/umk3_clone
              cd /var/www/umk3
            fi

            echo "=== 3. Setting up Python environment & secrets for Telegram Bot ==="
            DOMAIN="${{ secrets.VPS_HOST }}"
            if [[ "$DOMAIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              DOMAIN="${DOMAIN}.sslip.io"
            fi

            # Stamp the current commit hash for server-side version handshake
            COMMIT_HASH=$(git rev-parse --short HEAD)
            if [ -n "${{ secrets.TG_BOT_TOKEN }}" ]; then
              echo "TELEGRAM_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}" > .env
              echo "TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}" >> .env
              echo "WEBAPP_URL=https://${DOMAIN}/player/" >> .env
              echo "BUILD_VERSION=${COMMIT_HASH}" >> .env
              # Players must prove who they are with Telegram's signed initData (checked with the bot token)
              echo "REQUIRE_TG_AUTH=1" >> .env
              # Optional: short name of the Direct Link Mini App (@BotFather /newapp) for one-tap Play buttons
              echo "WEBAPP_SHORT_NAME=${{ secrets.WEBAPP_SHORT_NAME }}" >> .env
            else
              # No bot token but still stamp build version for non-bot deployments
              echo "BUILD_VERSION=${COMMIT_HASH}" > .env
            fi

            # Patch APP_BUILD_HASH in HTML entrypoints to match deployed commit
            sed -i "s/APP_BUILD_HASH = \"[^\"]*\"/APP_BUILD_HASH = \"${COMMIT_HASH}\"/g" player/play.html || true
            sed -i "s/APP_BUILD_HASH = \"[^\"]*\"/APP_BUILD_HASH = \"${COMMIT_HASH}\"/g" player/index.html || true

            # Patch CURRENT_BUILD constant in network_pure.js to match
            sed -i "s/const CURRENT_BUILD = \"[^\"]*\"/const CURRENT_BUILD = \"${COMMIT_HASH}\"/g" player/js/network_pure.js || true

            echo "Build version stamped: ${COMMIT_HASH}"

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt

            echo "=== 4. Service user and file permissions ==="
            if ! id -u umk3 >/dev/null 2>&1; then
              $SUDO useradd --system --no-create-home --shell /usr/sbin/nologin umk3
            fi
            $SUDO chown -R umk3:umk3 /var/www/umk3/data
            $SUDO chgrp umk3 /var/www/umk3/.env
            $SUDO chmod 640 /var/www/umk3/.env

            echo "=== 5. Updating Nginx configuration for ${DOMAIN} ==="
            if [ -f "vps/nginx.conf" ]; then
              NGINX_CONF=/etc/nginx/sites-available/umk3.conf
              sed "s/YOUR_DOMAIN/${DOMAIN}/g" vps/nginx.conf > /tmp/umk3_nginx.conf
              if [ -f "$NGINX_CONF" ]; then $SUDO cp "$NGINX_CONF" /tmp/umk3_nginx.conf.bak; fi
              $SUDO cp /tmp/umk3_nginx.conf "$NGINX_CONF"
              $SUDO rm -f /etc/nginx/sites-enabled/*
              $SUDO ln -sf "$NGINX_CONF" /etc/nginx/sites-enabled/umk3.conf
              if $SUDO nginx -t; then
                $SUDO systemctl reload nginx
                echo "Nginx reloaded successfully with WebSocket & REST proxy."
              else
                # Put the working config back and fail the deploy, so a bad config is never left on disk
                echo "ERROR: Nginx test failed; restoring the previous configuration."
                if [ -f /tmp/umk3_nginx.conf.bak ]; then $SUDO cp /tmp/umk3_nginx.conf.bak "$NGINX_CONF"; fi
                exit 1
              fi
              # The checkout holds .env and the database; fail loudly if either is reachable from the web
              for SECRET_PATH in /.env /data/immortal_combat.db /.git/config; do
                CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${DOMAIN}${SECRET_PATH}" || echo "000")
                if [ "$CODE" = "200" ]; then
                  echo "ERROR: ${SECRET_PATH} is publicly reachable (HTTP 200)."
                  exit 1
                fi
              done
            fi

            echo "=== 6. Restarting Bot Service ==="
            SERVICE=/etc/systemd/system/umk3-bot.service
            $SUDO cp vps/umk3-bot.service "$SERVICE"
            $SUDO systemctl daemon-reload
            $SUDO systemctl enable umk3-bot
            $SUDO systemctl restart umk3-bot

            wait_healthy() {
              for i in $(seq 1 30); do
                if health | grep -q '"status": "ok"'; then return 0; fi
                sleep 1
              done
              return 1
            }
            if wait_healthy; then
              echo "Server is up: $(health)"
            else
              echo "ERROR: the server did not come up as user umk3. Last log lines:"
              $SUDO journalctl -u umk3-bot -n 60 --no-pager || true
              # Keep production running as before, and fail the deploy so this gets looked at
              $SUDO sed -i 's/^User=umk3$/User=root/; s/^Group=umk3$/Group=root/' "$SERVICE"
              $SUDO systemctl daemon-reload
              $SUDO systemctl restart umk3-bot
              if wait_healthy; then echo "Running as root again."; fi
              exit 1
            fi

            echo "=== Deployment to VPS Completed Successfully! ==="
