server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # The root is the git checkout, which also holds .env (bot token), data/ (the database), .git and the
    # server code. Only /player/ and /docs/ are public; every other path is a 404 (see the last location).
    root /var/www/umk3;

    # Telegram Mini App iframe embedding allowance
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org telegram: t.me;" always;
    add_header Access-Control-Allow-Origin * always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/wasm;
    gzip_min_length 256;

    location = / {
        return 302 /player/index.html$is_args$args;
    }

    # The game. ^~ keeps the regex locations below from matching paths outside this folder.
    location ^~ /player/ {
        location ~ /\. {
            return 404;
        }
        location ~* \.(png|jpg|jpeg|gif|ico|svg|mid|mp3|wav)$ {
            add_header Cache-Control "public, max-age=86400" always;
            add_header Access-Control-Allow-Origin * always;
            access_log off;
        }
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Access-Control-Allow-Origin * always;
        try_files $uri $uri/ =404;
    }

    location ^~ /docs/ {
        location ~ /\. {
            return 404;
        }
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Access-Control-Allow-Origin * always;
        try_files $uri =404;
    }

    # Real-time WebSocket match gateway
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Ultra-low-latency real-time combat tuning (zero buffer lag)
        proxy_buffering off;
        proxy_cache off;
        tcp_nodelay on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The admin panel's page, from the app. Its data comes through /api/admin/, and neither answers without the
    # signed link from the bot's /admin command. The link's token is in its #fragment, so it never gets logged here.
    location = /admin {
        return 302 /admin/;
    }
    location = /admin/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    # REST API for match info & group leaderboards
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The app sends its own CORS header and so does this server block; two copies make browsers refuse
        # cross-origin reads (replays fetched by the GitHub Pages copy of the game)
        proxy_hide_header Access-Control-Allow-Origin;
    }

    # Everything else in the checkout stays private
    location / {
        return 404;
    }
}
