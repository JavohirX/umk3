server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/umk3;
    index index.html;

    # Telegram Mini App iframe embedding allowance
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org telegram: t.me;" always;
    add_header Access-Control-Allow-Origin * always;
    add_header Accept-Ranges bytes always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/wasm;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /player/index.html;
    }

    # Real-time WebSocket match gateway
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API for match info & group leaderboards
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.(jar|jad|wasm)$ {
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
        expires 7d;
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|mid|mp3|wav|js|css)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
