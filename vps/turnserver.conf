# coturn for Immortal Combat: relays the fight's WebRTC channel between two players over UDP when they
# can't reach each other directly (carrier NAT). The deploy fills in the placeholders.
# Logins are short-lived and signed by the game server with the shared secret (server/multiplayer.py,
# turn_ice_servers), so only players in a match can use the relay.

listening-port=3478
external-ip=EXTERNAL_IP
min-port=49160
max-port=49200
realm=TURN_REALM

use-auth-secret
static-auth-secret=TURN_SECRET
fingerprint

# UDP only: no TLS listeners, no TCP relaying
no-tls
no-dtls
no-tcp-relay
no-multicast-peers
no-cli

# Relay only to players on the public internet, never into this machine's loopback or private networks
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# A fight needs one allocation per player; these stop one login from hogging the relay
user-quota=4
total-quota=200
max-bps=256000
stale-nonce=600

log-file=syslog
simple-log
