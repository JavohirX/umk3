* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 14px/20px Geist, system-ui, -apple-system, "Segoe UI", sans-serif; }
h1, h2, h3, p { margin: 0; text-wrap: pretty; }
h1 { font-size: 16px; line-height: 24px; font-weight: 600; }
h2 { font-size: 20px; line-height: 28px; font-weight: 600; text-wrap: balance; }
h3 { font-size: 14px; line-height: 20px; font-weight: 600; }
a { color: var(--accent-ink); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: 16px; top: -64px; background: var(--surface); padding: 8px 12px; border-radius: 8px; z-index: 20; }
.skip:focus { top: 8px; }

.layout { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 16px 12px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
.brand { padding: 4px 12px; }
.brand small { display: block; color: var(--ink-3); font-size: 12px; line-height: 16px; }
.tabs { display: flex; flex-direction: column; gap: 2px; list-style: none; margin: 0; padding: 0; }
.tabs a { display: block; padding: 8px 12px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; transition: background-color .3s cubic-bezier(.22,1,.36,1), color .3s cubic-bezier(.22,1,.36,1); white-space: nowrap; }
.tabs a:hover { background: var(--raised); color: var(--ink); }
.tabs a[aria-current="page"] { background: var(--raised); color: var(--ink); font-weight: 600; }
.side-foot { margin-top: auto; padding: 0 12px; color: var(--ink-3); font-size: 12px; line-height: 16px; display: grid; gap: 8px; }
.main { padding: 16px 24px 64px; min-width: 0; max-width: 1360px; }

.livebar { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
.livebar b { font-weight: 600; }
.livebar span { color: var(--ink-2); white-space: nowrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 8px; }
.dot.off { background: var(--bad); }

.filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 24px; }
.seg { display: inline-flex; gap: 2px; background: var(--raised); padding: 2px; border-radius: 8px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 4px 12px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-weight: 500; transition: background-color .3s cubic-bezier(.22,1,.36,1); }
.seg button:hover { color: var(--ink); }
.seg button:active { transform: translateY(1px); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; }
.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; line-height: 16px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 4px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; color: var(--ink); transition: background-color .3s cubic-bezier(.22,1,.36,1); }
.btn:hover { background: var(--raised); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: default; }
.link { border: 0; background: none; padding: 0; color: var(--accent-ink); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 12px; min-width: 240px; }
select.input { min-width: 0; }

.refreshing { opacity: .6; transition: opacity .3s cubic-bezier(.22,1,.36,1); }
section.block { margin-bottom: 40px; }
section.block > h2 { margin-bottom: 4px; }
section.block > .note { color: var(--ink-2); max-width: 760px; margin-bottom: 12px; }
.stack { display: grid; gap: 16px; margin-top: 12px; }
.kpis { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 12px; }
.kpis.strip { gap: 16px 24px; }
.kpis.strip .kpi-value { font-size: 24px; line-height: 32px; }
.kpis.strip .kpi-value.none { font-size: 16px; line-height: 32px; }
.inner-strip { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--grid); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.kpi-label { color: var(--ink-2); font-weight: 500; }
.kpi-value { font-size: 30px; line-height: 36px; font-weight: 600; margin-top: 4px; word-break: break-word; }
.kpi-value.none { color: var(--ink-3); font-weight: 500; font-size: 18px; line-height: 36px; }
.kpi-note { color: var(--ink-2); font-size: 12px; line-height: 16px; margin-top: 2px; }
.chip { font-size: 12px; line-height: 16px; padding: 2px 8px; border-radius: 9999px; background: var(--raised); color: var(--ink-2); white-space: nowrap; }
.chip.small-sample { background: none; box-shadow: inset 0 0 0 1px var(--warn); color: var(--warn-ink); }
.kpi-head, .title-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.kpi-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; color: var(--ink-3); font-size: 12px; line-height: 16px; }
.info { position: relative; flex: none; width: 16px; height: 16px; padding: 0; border: 1px solid var(--axis); border-radius: 50%; background: none; color: var(--ink-3); font-size: 11px; line-height: 14px; font-weight: 600; text-align: center; cursor: pointer; transition: background-color .3s cubic-bezier(.22,1,.36,1); }
.info::after { content: ""; position: absolute; inset: -6px; }
.info:hover, .info[aria-expanded="true"] { background: var(--raised); color: var(--ink); }
.why { margin-top: 8px; padding: 8px 12px; border-radius: 8px; background: var(--raised); color: var(--ink-2); font-size: 12px; line-height: 16px; max-width: 880px; }
.why p + p { margin-top: 4px; }
.card.corner { position: relative; }
.card.corner > .info { position: absolute; top: 12px; right: 12px; z-index: 1; }
details.fold summary { cursor: pointer; list-style: none; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold summary:hover { color: var(--ink); }
details.fold p { margin-top: 4px; color: var(--ink-2); font-size: 12px; line-height: 16px; }

.meter { position: relative; height: 8px; margin-top: 8px; border-radius: 4px; background: var(--track); }
.meter.warn, .meter.fail { background: var(--raised); }
.meter-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); }
.meter.warn .meter-fill { background: var(--warn); }
.meter.fail .meter-fill { background: var(--bad); }
.meter-tick { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); }
.meter-tick.soft { top: 0; bottom: 0; background: var(--ink-3); }
.viz-caption { margin-top: 4px; color: var(--ink-2); font-size: 12px; line-height: 16px; }
.viz-keys { display: flex; flex-wrap: wrap; gap: 0 12px; margin-top: 4px; color: var(--ink-2); font-size: 12px; line-height: 16px; }
.viz-keys i { display: inline-block; width: 2px; height: 10px; margin-right: 8px; vertical-align: -1px; background: var(--ink); }
.viz-keys i.soft { background: var(--ink-3); }
.spark svg { margin-top: 8px; }
.counts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
.counts b { display: block; font-size: 16px; line-height: 20px; font-weight: 600; }
.counts span { color: var(--ink-2); font-size: 12px; line-height: 16px; }
.counts .zero b { color: var(--ink-3); font-weight: 500; }
.cells { display: flex; gap: 2px; margin-top: 8px; }
.cells i { flex: 1 1 0; height: 12px; border-radius: 2px; background: var(--good); }
.cells i.warn { background: var(--warn); }
.cells i.fail { background: var(--bad); }
.ci { position: relative; height: 24px; }
.ci-mid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--axis); }
.ci-band { position: absolute; top: 50%; height: 8px; margin-top: -4px; border-radius: 4px; background: var(--track); }
.ci-dot { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }
.ci-scale { position: relative; height: 16px; color: var(--ink-3); font-size: 12px; line-height: 16px; }
.ci-scale span { position: absolute; transform: translateX(-50%); }
.ci-scale span:first-child { transform: none; }
.ci-scale span:last-child { transform: translateX(-100%); }

.headlines { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 8px; }
.h-value { font-size: 24px; line-height: 32px; font-weight: 600; }
.h-value.none { color: var(--ink-3); font-size: 16px; font-weight: 500; }

.bars { display: grid; grid-template-columns: fit-content(45%) minmax(40px, 1fr) auto; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.bars.with-share { grid-template-columns: fit-content(45%) minmax(40px, 1fr) auto auto; }
.bars.funnel { grid-template-columns: fit-content(30%) minmax(40px, 1fr) auto auto minmax(72px, auto); }
.bars-label { color: var(--ink-2); }
.bars-track i { display: block; height: 12px; min-width: 2px; border-radius: 0 4px 4px 0; background: var(--s1); }
.bars .num { text-align: right; }
.bars .share-of { text-align: right; color: var(--ink-3); min-width: 48px; }
.bars .share-goal { grid-column: 1 / -1; margin: 0; }
.lost { text-align: right; color: var(--ink-3); white-space: nowrap; }
.lost.most { color: var(--ink); font-weight: 600; }
.lost svg, .val svg { width: 12px; height: 12px; margin-right: 4px; vertical-align: -1px; }

.fighters { display: grid; grid-template-columns: minmax(72px, max-content) minmax(64px, 1fr) 40px minmax(180px, 2.4fr) 48px; gap: 4px 12px; align-items: center; font-variant-numeric: tabular-nums; }
.fighters .th { color: var(--ink-3); font-size: 12px; line-height: 16px; }
.fighters .num { text-align: right; }
.matrix { table-layout: fixed; min-width: calc(112px + var(--n) * 64px); }
.matrix th, .matrix td { height: 32px; padding: 0 4px; border: 1px solid var(--surface); text-align: center; white-space: normal; vertical-align: middle; }
.matrix tr:last-child td { border-bottom: 1px solid var(--surface); }
.matrix thead th { height: auto; padding-bottom: 4px; vertical-align: bottom; border: 0; }
.matrix tbody th { width: 112px; padding-left: 0; color: var(--ink-2); font-size: 14px; line-height: 20px; text-align: left; white-space: nowrap; border: 0; }
.matrix thead th:first-child { width: 112px; }
.matrix td.same { background: var(--raised); }
.matrix td.few { color: var(--ink-3); }
.d0, .d4, .h3, .h4 { color: #fff; }
.d1, .d2, .d3, .h0, .h1, .h2 { color: #0b0b0b; }
.d0 { background: #c93a39; } .d1 { background: #f3b6b3; } .d2 { background: #f0efec; } .d3 { background: #9ec5f4; } .d4 { background: #256abf; }
.h0 { background: #cde2fb; } .h1 { background: #9ec5f4; } .h2 { background: #6da7ec; } .h3 { background: #256abf; } .h4 { background: #104281; }

.cell-bar { display: flex; flex-direction: row-reverse; align-items: center; gap: 8px; }
.cell-num { min-width: 44px; }
.cell-track { flex: none; width: 64px; }
.cell-track i { display: block; height: 8px; min-width: 2px; border-radius: 0 4px 4px 0; background: var(--s1); }
.flag-off { color: var(--ink-3); }
.flag-on { font-weight: 600; }

.vs-who { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 24px; }
.vs-who span { display: block; color: var(--ink-2); font-size: 12px; line-height: 16px; }
.versus { display: grid; gap: 4px; }
.vs-row { display: grid; grid-template-columns: 72px minmax(24px, 1fr) minmax(112px, 1.6fr) minmax(24px, 1fr) 72px; grid-template-areas: "v1 b1 lab b2 v2"; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.vs-row .lab { grid-area: lab; text-align: center; color: var(--ink-2); font-size: 12px; line-height: 16px; }
.vs-row .val.l { grid-area: v1; text-align: right; }
.vs-row .val.r { grid-area: v2; }
.vs-row .bar-l { grid-area: b1; }
.vs-row .bar-r { grid-area: b2; }
.vs-row .bar-l i, .vs-row .bar-r i { display: block; height: 12px; min-width: 2px; }
.vs-row .bar-l i { margin-left: auto; border-radius: 4px 0 0 4px; background: var(--s1); }
.vs-row .bar-r i { border-radius: 0 4px 4px 0; background: var(--s2); }
.val.worse { color: var(--bad-ink); font-weight: 600; white-space: nowrap; }

.chart-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.chart-box { position: relative; }
.chart-box svg { display: block; width: 100%; overflow: visible; }
.chart-box text { fill: var(--ink-3); font: 400 12px Geist, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; color: var(--ink-2); font-size: 12px; line-height: 16px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 4px; vertical-align: -2px; }
.legend i.ln { height: 2px; vertical-align: 3px; width: 16px; border-radius: 1px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.16); z-index: 5; min-width: 120px; font-size: 12px; line-height: 16px; opacity: 0; transition: opacity .2s cubic-bezier(.22,1,.36,1); }
.tip.on { opacity: 1; }
.tip .tx { color: var(--ink-3); margin-bottom: 4px; white-space: nowrap; }
.tip .tr { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tip .tr b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
.tip .tr i { width: 12px; height: 2px; border-radius: 1px; display: inline-block; flex: none; }
.tip .tr span { color: var(--ink-2); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-2.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-2 .wide { grid-column: 1 / -1; }

.early { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-bottom: 24px; padding: 8px 12px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--warn); color: var(--warn-ink); }
.early b { font-weight: 600; }
.tile { display: flex; flex-direction: column; }
.tile-link { color: var(--ink-2); font-weight: 500; text-decoration: none; text-underline-offset: 2px; }
.tile-link:hover { color: var(--ink); text-decoration: underline; }
.faults { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 12px 16px; }
.faults.loud { box-shadow: inset 0 0 0 1px var(--bad); }
.faults .why { flex-basis: 100%; margin-top: 0; }
.faults-words { color: var(--ink-2); }
.faults.loud .faults-words { color: var(--ink); font-weight: 600; }
.headline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 12px; margin-top: 4px; }
.headline .kpi-value { margin-top: 0; }
.headline .status { align-self: center; }
.g-line { position: relative; height: 16px; font-size: 12px; line-height: 16px; white-space: nowrap; color: var(--ink-2); }
.g-line span { position: absolute; }
.g-line.strong { color: var(--ink); font-weight: 500; }

<script>

  block.rows.forEach((r, i) => {
    if (r.over_goal && !(i && block.rows[i - 1].over_goal)) nodes.push(el("div", { class: "share-goal" }, el("span", { text: `Over the ${block.goal}ms goal` }), el("i")));
    nodes.push(el("div", { class: "share" }, el("span", { text: r.label }),
      el("div", { class: "share-bar" }, el("i", { style: `width:${(r.value / biggest * 100).toFixed(1)}%` })),
      el("span", { text: r.value < 0.001 ? "<0.1%" : fmt(r.value, "pct") })));
  });
  box.replaceChildren(el("div", { class: "shares" }, nodes));
}

function drawColumns(box, block, width) {
  const H = block.compact ? 144 : 220, left = 52, right = 8, top = 8, bottom = 24;
  const plotW = width - left - right, plotH = H - top - bottom;
  const x = block.x, n = x.length;
  const totals = x.map((_, i) => block.series.reduce((sum, s) => sum + (s.values[i] || 0), 0));
  const scale = niceScale(Math.max(...totals), block.unit);
  const root = svg("svg", { width, height: H, viewBox: `0 0 ${width} ${H}`, role: "img", "aria-label": block.title });
  axes(root, scale, left, width - right, top, plotH, block.unit);
  const band = plotW / n;
  const barW = Math.min(24, Math.max(2, band - Math.min(8, band * 0.3)));
  const span = spanOf(block);
  const labelEvery = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(plotW / 72))));
  box.replaceChildren(root);
  const tip = makeTip(box);
  x.forEach((xi, i) => {
    const cx = left + band * (i + 0.5);
    let base = top + plotH;
    const topSeries = block.series.reduce((last, s, si) => (s.values[i] ? si : last), -1);
    block.series.forEach((s, si) => {
      const v = s.values[i] || 0;
      if (!v) return;
      const fullH = (v / scale.top) * plotH;
      const h = Math.max(1, fullH - (block.series.length > 1 && si < topSeries ? 2 : 0));
      const y = base - h;
      root.append(si === topSeries ? svg("path", { d: barPath(cx - barW / 2, y, barW, h, 4), fill: `var(${COLORS[si % COLORS.length]})` })
                                   : svg("rect", { x: cx - barW / 2, y, width: barW, height: h, fill: `var(${COLORS[si % COLORS.length]})` }));
      base -= fullH;
    });
    if (i % labelEvery === 0) {
      const label = svg("text", { x: cx, y: H - 8, "text-anchor": "middle" });
      label.textContent = xLabel(xi, block.x_kind, span);
      root.append(label);
    }
    const hit = svg("rect", { x: left + band * i, y: top, width: band, height: plotH, fill: "transparent", tabindex: n <= 40 ? 0 : null, "aria-label": `${xLabel(xi, block.x_kind, span)}: ${block.series.map((s) => `${s.name} ${fmt(s.values[i], block.unit)}`).join(", ")}` });
    const show = () => showTip(box, tip, xLabel(xi, block.x_kind, span), block.series.slice().reverse().map((s) => ({
      name: block.series.length > 1 ? s.name : "", value: fmt(s.values[i] || 0, block.unit), color: block.series.length > 1 ? COLORS[block.series.indexOf(s) % COLORS.length] : COLORS[0] })), cx, base);
    hit.addEventListener("pointermove", show);
    hit.addEventListener("focus", show);
    hit.addEventListener("pointerleave", () => hideTip(tip));
    hit.addEventListener("blur", () => hideTip(tip));
    root.append(hit);
  });
}

function drawHBars(box, block, width) {
  const rowH = 32, left = Math.min(180, Math.max(96, width * 0.28)), right = 96, top = 4;
  const x = block.x;
  const H = top + x.length * rowH + 4;
  const plotW = Math.max(40, width - left - right);
  const funnel = block.kind === "funnel";
  const totals = x.map((_, i) => block.series.reduce((sum, s) => sum + (s.values[i] || 0), 0));
  const max = Math.max(...totals, 0) || 1;
  const root = svg("svg", { width, height: H, viewBox: `0 0 ${width} ${H}`, role: "img", "aria-label": block.title });
  box.replaceChildren(root);
  const tip = makeTip(box);
  x.forEach((xi, i) => {
    const y = top + i * rowH + 6, barH = 20;
    const label = svg("text", { x: left - 8, y: y + 14, "text-anchor": "end" });
    label.textContent = xLabel(xi, block.x_kind);
    root.append(label);
    root.append(svg("line", { x1: left, x2: left, y1: y - 6, y2: y + barH + 6, stroke: "var(--axis)" }));
    let at = left;
    block.series.forEach((s, si) => {
      const v = s.values[i] || 0;
      if (!v) return;
      const w = Math.max(1, (v / max) * plotW);
      const color = funnel ? RAMP[Math.min(i, RAMP.length - 1)] : COLORS[si % COLORS.length];
      root.append(svg("rect", { x: at, y, width: Math.max(1, w - (block.series.length > 1 ? 2 : 0)), height: barH, rx: si === block.series.length - 1 ? 4 : 0, fill: `var(${color})` }));
      at += w;
    });
    const tag = svg("text", { x: at + 8, y: y + 14 });
    tag.textContent = funnel && i ? `${fmt(totals[i], block.unit)}  ${totals[0] ? Math.round(totals[i] / totals[0] * 100) : 0}%` : fmt(totals[i], block.unit);
    root.append(tag);
    const hit = svg("rect", { x: 0, y: y - 6, width, height: rowH, fill: "transparent", tabindex: 0, "aria-label": `${xi}: ${fmt(totals[i], block.unit)}` });
    const show = () => showTip(box, tip, String(xi), block.series.map((s, si) => ({ name: block.series.length > 1 ? s.name : "", value: fmt(s.values[i] || 0, block.unit), color: funnel ? RAMP[Math.min(i, RAMP.length - 1)] : COLORS[si % COLORS.length] })), left, y + 4);
    hit.addEventListener("pointermove", show);
    hit.addEventListener("focus", show);
    hit.addEventListener("pointerleave", () => hideTip(tip));
    hit.addEventListener("blur", () => hideTip(tip));
    root.append(hit);
  });
}

function drawLine(box, block, width) {
  const H = block.compact ? 160 : 220, left = 52, right = 12, top = 8, bottom = 24;
  const plotW = width - left - right, plotH = H - top - bottom;
  const numeric = block.x_kind === "time" || block.x_kind === "clock";
  const series = block.series.map((s, si) => ({ name: s.name, color: slotOf(s, si), points: s.points || s.values.map((v, i) => [numeric ? block.x[i] : i, v]) }));
  const allX = series.flatMap((s) => s.points.map((p) => p[0]));
  const minX = Math.min(...allX), maxX = Math.max(...allX);
  const labelOf = (v) => numeric ? xLabel(v, block.x_kind, maxX - minX) : xLabel(block.x[v], block.x_kind);
  // A line needs a few points to be a trend. Before then the numbers say more than a lone dot does.
  const readings = series.map((s) => s.points.filter((p) => p[1] !== null && p[1] !== undefined));
  if (new Set(readings.flat().map((p) => p[0])).size < MIN_LINE_POINTS) {
    box.replaceChildren(block.headlines && block.headlines.length ? "" : el("p", {}, readings.map((points, i) => points.length ? el("div", { text: `${series.length > 1 ? `${series[i].name}: ` : ""}${points.map((p) => `${fmt(p[1], block.unit)} ${block.x_kind === "day" ? "on" : "at"} ${labelOf(p[0])}`).join(", ")}` }) : null)),
      el("p", { class: "why-line", text: `The chart appears from ${MIN_LINE_POINTS} ${LINE_POINTS[block.x_kind] || "readings"}.` }));
    box.parentElement.querySelector(".legend")?.remove();
    return;
  }
  const xOf = (v) => left + (maxX === minX ? plotW / 2 : ((v - minX) / (maxX - minX)) * plotW);
  const scale = niceScale(Math.max(...series.flatMap((s) => s.points.map((p) => p[1] || 0))), block.unit);
  const yOf = (v) => top + plotH - (v / scale.top) * plotH;
  const root = svg("svg", { width, height: H, viewBox: `0 0 ${width} ${H}`, role: "img", "aria-label": block.title });
  axes(root, scale, left, width - right, top, plotH, block.unit);
  const labels = Math.max(2, Math.floor(plotW / 96));
  const uniqueX = [...new Set(allX)].sort((a, b) => a - b);
  const every = Math.max(1, Math.ceil(uniqueX.length / labels));
  uniqueX.forEach((v, i) => {
    if (i % every) return;
    const label = svg("text", { x: xOf(v), y: H - 8, "text-anchor": "middle" });
    label.textContent = labelOf(v);
    root.append(label);
  });
  series.forEach((s) => {
    const color = `var(${s.color})`;
    let d = "", wash = "", pen = false, lastX = 0;
    const base = yOf(0).toFixed(1);
    s.points.forEach(([x, y]) => {
      if (y === null || y === undefined) {
        if (pen) wash += `L${lastX} ${base}Z`;
        pen = false;
        return;
      }
      const px = xOf(x).toFixed(1), py = yOf(y).toFixed(1);
      d += `${pen ? "L" : "M"}${px} ${py}`;
      wash += pen ? `L${px} ${py}` : `M${px} ${base}L${px} ${py}`;
      pen = true;
      lastX = px;
    });
    if (pen) wash += `L${lastX} ${base}Z`;
    if (series.length === 1) root.append(svg("path", { d: wash, fill: color, "fill-opacity": 0.1 }));
    root.append(svg("path", { d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const known = s.points.filter((p) => p[1] !== null && p[1] !== undefined);
    const last = known[known.length - 1];
    if (last) root.append(svg("circle", { cx: xOf(last[0]), cy: yOf(last[1]), r: 4, fill: color, stroke: "var(--surface)", "stroke-width": 2 }));
    // A lone point between gaps has no line of its own
    if (known.length && s.points.length < 40) s.points.forEach((p, i) => {
      const before = s.points[i - 1], after = s.points[i + 1];
      if (p[1] !== null && (!before || before[1] === null) && (!after || after[1] === null)) root.append(svg("circle", { cx: xOf(p[0]), cy: yOf(p[1]), r: 4, fill: color }));
    });
  });
  const cross = svg("line", { y1: top, y2: top + plotH, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
  root.append(cross);
  box.replaceChildren(root);
  const tip = makeTip(box);
  let at = uniqueX.length - 1;
  const showAt = (index) => {
    at = Math.max(0, Math.min(uniqueX.length - 1, index));
    const v = uniqueX[at];
    cross.setAttribute("x1", xOf(v));
    cross.setAttribute("x2", xOf(v));
    cross.setAttribute("visibility", "visible");
    const rows = series.map((s) => {
      const near = s.points.reduce((best, p) => (!best || Math.abs(p[0] - v) < Math.abs(best[0] - v) ? p : best), null);
      return { name: series.length > 1 ? s.name : "", value: fmt(near ? near[1] : null, block.unit), color: s.color };
    });
    showTip(box, tip, labelOf(v), rows, xOf(v), top + 48);
  };
  const hit = svg("rect", { x: left, y: top, width: plotW, height: plotH, fill: "transparent", tabindex: 0, "aria-label": `${block.title}. Use the arrow keys to read values.` });
  hit.addEventListener("pointermove", (e) => {
    const rect = root.getBoundingClientRect();
    const px = e.clientX - rect.left;
    let best = 0, bestD = Infinity;
    uniqueX.forEach((v, i) => { const d = Math.abs(xOf(v) - px); if (d < bestD) { bestD = d; best = i; } });
    showAt(best);
  });
  hit.addEventListener("pointerleave", () => { hideTip(tip); cross.setAttribute("visibility", "hidden"); });
  hit.addEventListener("focus", () => showAt(at));
  hit.addEventListener("blur", () => { hideTip(tip); cross.setAttribute("visibility", "hidden"); });
  hit.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { showAt(at - 1); e.preventDefault(); }
    if (e.key === "ArrowRight") { showAt(at + 1); e.preventDefault(); }
  });
  root.append(hit);
}

new ResizeObserver(() => {
  clearTimeout(window.__resizeTimer);
  window.__resizeTimer = setTimeout(() => liveCharts.forEach((box) => box._draw && box._draw()), 120);
}).observe(document.documentElement);

// ----- blocks -----
const openState = new Set();
function toggleState(key) { if (openState.has(key)) openState.delete(key); else openState.add(key); }

const isSmall = (item, lowSample) => item.n !== null && item.n !== undefined && item.n > 0 && item.n < lowSample;
const countText = (item) => item.n !== null && item.n !== undefined ? `${item.n.toLocaleString()} ${item.n === 1 ? singular(item.n_label) : item.n_label}` : null;
const smallChip = () => el("span", { class: "chip small-sample", title: "Too few to decide anything from this alone", text: "Small sample" });

// How a number is worked out and where it comes from: one click away on everything, rather than printed on everything.
// Returns the button for the heading and the text it opens. The choice survives the page refreshing underneath it.
function explain(key, name, ...lines) {
  const text = lines.filter(Boolean);
  if (!text.length) return [null, null];
  const open = openState.has(key);
  const panel = el("div", { class: "why", hidden: !open }, text.map((t) => el("p", { text: t })));
  const button = el("button", { class: "info", type: "button", text: "i", title: "How this is worked out", "aria-label": `How this is worked out: ${name}`, "aria-expanded": open ? "true" : "false",
    onclick: () => { toggleState(key); const now = openState.has(key); panel.hidden = !now; button.setAttribute("aria-expanded", now ? "true" : "false"); } });
  return [button, panel];
}
function fold(key, summary, ...body) {
  return el("details", { class: "fold", open: openState.has(key) || null, ontoggle: (e) => { if (e.target.open) openState.add(key); else openState.delete(key); } },
    el("summary", {}, summary), body);
}
function kpiValue(item) {
  const none = item.value === null || item.value === undefined;
  return el("div", { class: `kpi-value${none ? " none" : ""}`, text: none ? "No data yet" : fmt(item.value, item.unit) });
}

// ----- small pictures that sit with a number -----
const along = (v, scale) => Math.max(0, Math.min(100, v / scale * 100));

function meterViz(item, v) {
  const scale = v.scale || 1;
  const mark = v.mark === null || v.mark === undefined ? null : v.mark;
  return el("div", { class: `meter ${item.tone === "warn" || item.tone === "fail" ? item.tone : ""}`, role: "img", "aria-label": `${item.label}: ${fmt(item.value, item.unit)}${mark !== null ? `, against a line at ${fmt(mark, item.unit)}` : ""}` },
    item.value > 0 ? el("i", { class: "meter-fill", style: `width:${along(item.value, scale)}%;min-width:2px` }) : null,
    mark !== null ? el("i", { class: "meter-tick", style: `left:${along(mark, scale)}%` }) : null);
}

// The typical value filled in, and a line where the bad end reaches
function rangeViz(item, v) {
  const scale = Math.max(v.to, item.value) * 1.1 || 1;
  return [el("div", { class: "meter", role: "img", "aria-label": `${item.label}: ${fmt(item.value, item.unit)}. ${v.label}: ${fmt(v.to, item.unit)}` },
    item.value > 0 ? el("i", { class: "meter-fill", style: `width:${along(item.value, scale)}%;min-width:2px` }) : null,
    el("i", { class: "meter-tick", style: `left:${along(v.to, scale)}%` })),
    el("div", { class: "viz-caption", text: `${v.label}: ${fmt(v.to, item.unit)}` })];
}

function goalViz(item, v) {
  const known = v.slowest !== null && v.slowest !== undefined;
  return [el("div", { class: `meter ${item.tone === "warn" ? "warn" : ""}`, role: "img", "aria-label": `${item.label}: ${fmt(item.value, item.unit)}, against a goal of ${fmt(v.goal, item.unit)}${known ? `. Slowest 5%: ${fmt(v.slowest, item.unit)}` : ""}` },
    el("i", { class: "meter-fill", style: `width:${along(item.value, v.scale)}%` }),
    known ? el("i", { class: "meter-tick soft", style: `left:${along(v.slowest, v.scale)}%` }) : null,
    el("i", { class: "meter-tick", style: `left:${along(v.goal, v.scale)}%` })),
    el("div", { class: "viz-keys" }, el("span", {}, el("i"), `Goal ${fmt(v.goal, item.unit)}`), known ? el("span", {}, el("i", { class: "soft" }), `Slowest 5% ${fmt(v.slowest, item.unit)}`) : null)];
}

function intervalViz(item, v) {
  const at = (x) => (x * 100).toFixed(1);
  return [el("div", { class: "ci", role: "img", style: "margin-top:4px", "aria-label": `${item.label}: ${fmt(item.value, item.unit)}, likely between ${fmt(v.low, item.unit)} and ${fmt(v.high, item.unit)}. ${fmt(v.fair, item.unit)} is fair.` },
    el("i", { class: "ci-band", style: `left:${at(v.low)}%;width:${at(v.high - v.low)}%` }),
    el("i", { class: "ci-mid", style: `left:${at(v.fair)}%` }),
    el("i", { class: "ci-dot", style: `left:${at(item.value)}%` })),
    el("div", { class: "ci-scale", "aria-hidden": "true" }, el("span", { style: "left:0", text: "0%" }), el("span", { style: `left:${at(v.fair)}%`, text: `${Math.round(v.fair * 100)}%` }), el("span", { style: "left:100%", text: "100%" }))];
}

function countsViz(item, v) {
  return el("div", { class: "counts" }, v.items.map((c) => el("div", { class: c.value ? "" : "zero" }, el("b", { text: c.value.toLocaleString() }), el("span", { text: c.label }))));
}

function cellsStrip(statuses, label) {
  return el("div", { class: "cells", role: "img", "aria-label": label }, statuses.map((s) => el("i", { class: s === "ok" ? null : s })));
}
function cellsViz(item, v) {
  return cellsStrip(v.statuses, `${item.label}: ${item.value}, ${item.verdict}`);
}

const VIZ = { meter: meterViz, range: rangeViz, goal: goalViz, interval: intervalViz, counts: countsViz, cells: cellsViz };

function sparkViz(item) {
  const box = el("div", { class: "spark chart-box" });
  box._draw = () => drawSpark(box, item);
  liveCharts.add(box);
  return box;
}
function vizOf(item) {
  if (item.value === null || item.value === undefined) return null;
  return [item.viz ? VIZ[item.viz.kind](item, item.viz) : null, item.trend ? sparkViz(item) : null];
}

// The shape of a number over the days in range. From zero up, so a wobble of a few percent looks like one. Too few days draws nothing.
function drawSpark(box, item) {
  if (!box.isConnected) { liveCharts.delete(box); return; }
  const { x, values, x_kind: kind } = item.trend;
  const known = values.map((v, i) => [i, v]).filter(([, v]) => v !== null && v !== undefined);
  if (known.length < MIN_LINE_POINTS) { box.replaceChildren(); return; }
  const width = Math.max(80, box.clientWidth), H = 32, pad = 6;
  const top = Math.max(...known.map(([, v]) => v)) || 1;
  const xOf = (i) => pad + (x.length > 1 ? i / (x.length - 1) : 0.5) * (width - pad * 2);
  const yOf = (v) => H - pad - (v / top) * (H - pad * 2);
  const root = svg("svg", { width, height: H, viewBox: `0 0 ${width} ${H}`, role: "img", "aria-label": `${item.label} by day, ${fmt(known[known.length - 1][1], item.unit)} on the latest` });
  root.append(svg("line", { x1: pad, x2: width - pad, y1: H - pad, y2: H - pad, stroke: "var(--axis)", "stroke-width": 1 }));
  let d = "", pen = false;
  values.forEach((v, i) => {
    if (v === null || v === undefined) { pen = false; return; }
    d += `${pen ? "L" : "M"}${xOf(i).toFixed(1)} ${yOf(v).toFixed(1)}`;
    pen = true;
  });
  root.append(svg("path", { d, fill: "none", stroke: "var(--accent)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  // A day between two gaps has no line of its own
  known.forEach(([i]) => {
    const before = values[i - 1], after = values[i + 1];
    if ((before === null || before === undefined) && (after === null || after === undefined)) root.append(svg("circle", { cx: xOf(i), cy: yOf(values[i]), r: 2, fill: "var(--accent)" }));
  });
  const [lastI, lastV] = known[known.length - 1];
  root.append(svg("circle", { cx: xOf(lastI), cy: yOf(lastV), r: 4, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2 }));
  const cross = svg("line", { y1: 0, y2: H, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
  root.append(cross);
  box.replaceChildren(root);
  const tip = makeTip(box);
  let at = known.length - 1;
  const showAt = (index) => {
    at = Math.max(0, Math.min(known.length - 1, index));
    const [i, v] = known[at];
    cross.setAttribute("x1", xOf(i));
    cross.setAttribute("x2", xOf(i));
    cross.setAttribute("visibility", "visible");
    showTip(box, tip, xLabel(x[i], kind), [{ value: fmt(v, item.unit), color: "--accent" }], xOf(i), 0);
  };
  const hide = () => { hideTip(tip); cross.setAttribute("visibility", "hidden"); };
  const hit = svg("rect", { x: 0, y: 0, width, height: H, fill: "transparent", tabindex: 0, "aria-label": `${item.label} by day. Use the arrow keys to read values.` });
  hit.addEventListener("pointermove", (e) => {
    const px = e.clientX - root.getBoundingClientRect().left;
    let best = 0, bestD = Infinity;
    known.forEach(([i], k) => { const gap = Math.abs(xOf(i) - px); if (gap < bestD) { bestD = gap; best = k; } });
    showAt(best);
  });
  hit.addEventListener("pointerleave", hide);
  hit.addEventListener("focus", () => showAt(at));
  hit.addEventListener("blur", hide);
  hit.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { showAt(at - 1); e.preventDefault(); }
    if (e.key === "ArrowRight") { showAt(at + 1); e.preventDefault(); }
  });
  root.append(hit);
}

// A sparkline's days can only be read by hovering, so the same days are written out behind its i button
function trendTable(item, panel) {
  if (!panel || !item.trend || item.value === null || item.value === undefined) return;
  const { x, values, x_kind: kind } = item.trend;
  const rows = x.map((d, i) => ({ day: xLabel(d, kind), value: values[i] })).filter((r) => r.value !== null && r.value !== undefined);
  if (rows.length < MIN_LINE_POINTS) return;
  panel.append(el("div", { style: "margin-top:8px" }, dataTable([{ key: "day", label: "Day", unit: "text" }, { key: "value", label: item.label, unit: item.unit }], rows, {})));
}

// A number on its own card, or without one for a row of context held in one card: the same parts either way
function kpiParts(item, lowSample) {
  const [info, panel] = explain(`why:${item.label}`, item.label, item.why, SOURCE_WHY[item.source]);
  trendTable(item, panel);
  const count = countText(item), small = isSmall(item, lowSample);
  return [

          quiet.length ? el("p", { class: "why-line", text: `None on either phone: ${quiet.map(([label]) => label).join(", ")}.` }) : null);
      }))));
  } else if (f.fight_started_at) {
    nodes.push(el("div", { class: "card", style: "margin-bottom:40px" }, el("h3", { text: "No phone reports for this fight" }),
      el("p", { class: "why-line", text: "Reports go out every 10 seconds and when a fight ends. A fight this short, or phones that lost their connection, send none. The timeline above is the server's own record." })));
  }

  const lines = [["Worst frame per report", "max_frame_ms", "ms"], ["Time stalled per report", "stall_ms", "ms"], ["Opponent round trip", "peer_rtt", "ms"], ["Rollbacks per report", "rollbacks", "count"], ["Input delay", "delay", "ms"]]
    .filter(([, key]) => (data.lines[key] || []).length);
  if (lines.length) {
    const key = "reports";
    const show = openState.has(key);
    nodes.push(el("section", { class: "block" }, el("h2", { text: "Over the fight" }),
      el("div", { class: "grid-2 three", style: "margin-top:12px" }, lines.map(([title, lineKey, unit]) => chartBlock({
        title, kind: "line", series: data.lines[lineKey].map((s) => ({ ...s, slot: s.name === "P2" ? 1 : 0 })), unit, x_kind: "clock", source: null, legend: true, compact: true,
        why: "One point for each report a phone sent, at minutes and seconds into the fight.",
      })),
      el("div", { class: `card${show ? " wide" : ""}` }, el("h3", { text: "Raw phone reports", style: "margin-bottom:8px" }),
        el("button", { class: "link", type: "button", text: show ? "Hide reports" : `Show ${data.windows.length} reports`, onclick: () => { toggleState(key); rerender(); } }),
        show ? dataTable([{ key: "role", label: "Phone", unit: "text" }, { key: "t", label: "At", unit: "text" }, { key: "segment", label: "Segment", unit: "count" }, { key: "seq", label: "Number", unit: "count" }, { key: "reason", label: "Sent because", unit: "text" },
                          { key: "secs", label: "Wall clock", unit: "secs" }, { key: "active_secs", label: "Fight time", unit: "secs" }, { key: "paused_ms", label: "Paused", unit: "ms" }, { key: "hidden_ms", label: "Hidden", unit: "ms" }, { key: "ticks", label: "Ticks", unit: "count" },
                          { key: "delay", label: "Delay, ticks", unit: "count" }, { key: "peer_rtt", label: "Round trip", unit: "ms" }, { key: "stalls", label: "Stalls", unit: "count" }, { key: "stall_ms", label: "Stalled", unit: "ms" }, { key: "rollbacks", label: "Rollbacks", unit: "count" }, { key: "max_frame_ms", label: "Worst frame", unit: "ms" }],
          data.windows.map((w) => ({ ...w, t: xLabel(w.received_at - zero, "clock") })), {}) : null))));
  }
  showPage(nodes);
  filtersEl.replaceChildren();
}

async function loadFight(seq) {
  if (!lastFight || lastFight.fight.match_id !== state.fight) { skeleton(); filtersEl.replaceChildren(); }
  try {
    const data = await apiJson(`/api/admin/fight/${encodeURIComponent(state.fight)}`);
    if (seq !== loadSeq) return;
    lastFight = data;
    renderFight(data);
  } catch (err) {
    if (seq !== loadSeq || err.message === "signed out") return;
    pageEl.replaceChildren(el("div", { class: "card" }, el("h3", { text: "This fight couldn't load" }), el("p", { class: "why-line", text: err.message }),
      el("button", { class: "btn", type: "button", style: "margin-top:12px", text: "Back to all fights", onclick: () => { location.hash = "fights"; } })));
  }
}

// ----- live strip -----
let lastLive = null;
async function loadLive() {
  const bar = document.getElementById("live");
  try {
    const live = await apiJson("/api/admin/live");
    const hadFights = lastLive && lastLive.fights.length;
    lastLive = live;
    const up = live.uptime_secs;
    bar.replaceChildren(
      el("span", {}, el("i", { class: "dot" }), el("b", { text: `${live.live_fights} fighting now` })),
      el("span", { text: `${live.players} players connected` }), el("span", { text: `${live.spectators} watching` }), el("span", { text: `${live.waiting} challenges open` }),
      el("span", { class: "muted", text: `Up for ${fmt(up, "secs")}` }), el("span", { class: "muted", text: `Build ${live.build}` }));
    if (!state.fight && state.tab === "overview" && lastData && lastData.tab === "overview" && (hadFights || live.fights.length)) rerender();
  } catch (err) {
    if (err.message === "signed out") return;
    bar.replaceChildren(el("span", {}, el("i", { class: "dot off" }), el("b", { text: "Can't reach the server" })), el("span", { class: "muted", text: "Numbers below may be out of date." }));
  }
}

// ----- moving around -----
function route() {
  const hash = location.hash.replace(/^#/, "");
  if (hash.startsWith("fight/")) {
    state.fight = decodeURIComponent(hash.slice(6));
  } else {
    state.fight = null;
    state.tab = TABS.some(([id]) => id === hash) ? hash : "overview";
  }
  window.scrollTo(0, 0);
  load();
}
window.addEventListener("hashchange", route);

document.getElementById("theme").addEventListener("click", () => {
  const dark = getComputedStyle(document.documentElement).colorScheme.includes("dark");
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  store.set("ic_admin_theme", dark ? "light" : "dark");
  liveCharts.forEach((box) => box._draw && box._draw());
});
const savedTheme = store.get("ic_admin_theme");
if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

if (!token) {
  showLocked();
} else {
  route();
  loadLive();
  refreshTimer = setInterval(() => { if (!document.hidden && !state.fight) load(true); }, REFRESH_MS);
  liveTimer = setInterval(() => { if (!document.hidden) loadLive(); }, LIVE_MS);
}
</script>
</body>
</html>
