<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Immortal Combat admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232a78d6'/%3E%3Cpath d='M7 22V10h4v12zm7 0V6h4v16zm7 0v-8h4v8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --raised: #f0efec; --line: rgba(11,11,11,.10); --grid: #e1e0d9; --axis: #c3c2b7;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #6f6d68; --accent: #2a78d6; --accent-ink: #1c5cab;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --r1: #86b6ef; --r2: #5598e7; --r3: #2a78d6; --r4: #1c5cab; --r5: #104281;
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --warn-ink: #8a5a00; --bad: #d03b3b; --bad-ink: #b02a2a;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #181818; --surface: #1f1f1f; --raised: #272727; --line: rgba(255,255,255,.10); --grid: #2c2c2a; --axis: #383835;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #a3a198; --accent: #3987e5; --accent-ink: #86b6ef;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --r1: #184f95; --r2: #256abf; --r3: #3987e5; --r4: #6da7ec; --r5: #9ec5f4;
    --good: #0ca30c; --good-ink: #4cc94c; --warn: #fab219; --warn-ink: #fab219; --bad: #d03b3b; --bad-ink: #ec7a7a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #181818; --surface: #1f1f1f; --raised: #272727; --line: rgba(255,255,255,.10); --grid: #2c2c2a; --axis: #383835;
  --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #a3a198; --accent: #3987e5; --accent-ink: #86b6ef;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --r1: #184f95; --r2: #256abf; --r3: #3987e5; --r4: #6da7ec; --r5: #9ec5f4;
  --good: #0ca30c; --good-ink: #4cc94c; --warn: #fab219; --warn-ink: #fab219; --bad: #d03b3b; --bad-ink: #ec7a7a;
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 14px/20px Geist, system-ui, -apple-system, "Segoe UI", sans-serif; }
h1, h2, h3, p { margin: 0; text-wrap: pretty; }
h1 { font-size: 16px; line-height: 24px; font-weight: 600; }
h2 { font-size: 20px; line-height: 28px; font-weight: 600; text-wrap: balance; }
h3 { font-size: 14px; line-height: 20px; font-weight: 600; }
a { color: var(--accent-ink); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: 16px; top: -64px; background: var(--surface); padding: 8px 12px; border-radius: 8px; z-index: 20; }
.skip:focus { top: 8px; }

.layout { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 16px 12px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
.brand { padding: 4px 12px; }
.brand small { display: block; color: var(--ink-3); font-size: 12px; line-height: 16px; }
.tabs { display: flex; flex-direction: column; gap: 2px; list-style: none; margin: 0; padding: 0; }
.tabs a { display: block; padding: 8px 12px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; transition: background-color .3s cubic-bezier(.22,1,.36,1), color .3s cubic-bezier(.22,1,.36,1); white-space: nowrap; }
.tabs a:hover { background: var(--raised); color: var(--ink); }
.tabs a[aria-current="page"] { background: var(--raised); color: var(--ink); font-weight: 600; }
.side-foot { margin-top: auto; padding: 0 12px; color: var(--ink-3); font-size: 12px; line-height: 16px; display: grid; gap: 8px; }
.main { padding: 16px 24px 64px; min-width: 0; max-width: 1360px; }

.livebar { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
.livebar b { font-weight: 600; }
.livebar span { color: var(--ink-2); white-space: nowrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 8px; }
.dot.off { background: var(--bad); }

.filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 24px; }
.seg { display: inline-flex; gap: 2px; background: var(--raised); padding: 2px; border-radius: 8px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 4px 12px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-weight: 500; transition: background-color .3s cubic-bezier(.22,1,.36,1); }
.seg button:hover { color: var(--ink); }
.seg button:active { transform: translateY(1px); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; }
.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; line-height: 16px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 4px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; color: var(--ink); transition: background-color .3s cubic-bezier(.22,1,.36,1); }
.btn:hover { background: var(--raised); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: default; }
.link { border: 0; background: none; padding: 0; color: var(--accent-ink); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 12px; min-width: 240px; }
select.input { min-width: 0; }

.refreshing { opacity: .6; transition: opacity .3s cubic-bezier(.22,1,.36,1); }
section.block { margin-bottom: 40px; }
section.block > h2 { margin-bottom: 4px; }
section.block > .note { color: var(--ink-2); max-width: 760px; margin-bottom: 12px; }
.stack { display: grid; gap: 16px; margin-top: 12px; }
.kpis { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 12px; }
.kpis.strip { gap: 16px 24px; }
.kpis.strip .kpi-value { font-size: 24px; line-height: 32px; }
.kpis.strip .kpi-value.none { font-size: 16px; line-height: 32px; }
.inner-strip { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--grid); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.kpi-label { color: var(--ink-2); font-weight: 500; }
.kpi-value { font-size: 30px; line-height: 36px; font-weight: 600; margin-top: 4px; word-break: break-word; }
.kpi-value.none { color: var(--ink-3); font-weight: 500; font-size: 18px; line-height: 36px; }
.kpi-note { color: var(--ink-2); font-size: 12px; line-height: 16px; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chip { font-size: 12px; line-height: 16px; padding: 2px 8px; border-radius: 9999px; background: var(--raised); color: var(--ink-2); white-space: nowrap; }
.chip.small-sample { background: none; box-shadow: inset 0 0 0 1px var(--warn); color: var(--warn-ink); }
details.why { margin-top: 8px; }
details.why summary { cursor: pointer; color: var(--ink-3); font-size: 12px; line-height: 16px; list-style: none; }
details.why summary::-webkit-details-marker { display: none; }
details.why summary::before { content: "+ "; }
details.why[open] summary::before { content: "− "; }
details.why summary:hover { color: var(--ink); }
details.why p { margin-top: 4px; color: var(--ink-2); font-size: 12px; line-height: 16px; }

.chart-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 8px; flex-wrap: wrap; }
.chart-box { position: relative; }
.chart-box svg { display: block; width: 100%; overflow: visible; }
.chart-box text { fill: var(--ink-3); font: 400 12px Geist, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; color: var(--ink-2); font-size: 12px; line-height: 16px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 4px; vertical-align: -2px; }
.legend i.ln { height: 2px; vertical-align: 3px; width: 16px; border-radius: 1px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.16); z-index: 5; min-width: 120px; font-size: 12px; line-height: 16px; opacity: 0; transition: opacity .2s cubic-bezier(.22,1,.36,1); }
.tip.on { opacity: 1; }
.tip .tx { color: var(--ink-3); margin-bottom: 4px; white-space: nowrap; }
.tip .tr { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tip .tr b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
.tip .tr i { width: 12px; height: 2px; border-radius: 1px; display: inline-block; flex: none; }
.tip .tr span { color: var(--ink-2); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-2.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-2 .wide { grid-column: 1 / -1; }

.early { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-bottom: 24px; padding: 8px 12px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--warn); color: var(--warn-ink); }
.early b { font-weight: 600; }
.tile { display: flex; flex-direction: column; }
.tile-detail { flex-grow: 1; }
.tile-link { display: inline-block; margin-top: 8px; font-size: 12px; line-height: 16px; text-underline-offset: 2px; }
.faults { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 12px 16px; }
.faults.loud { box-shadow: inset 0 0 0 1px var(--bad); }
.faults details.why { flex-basis: 100%; margin-top: 0; }
.faults-words { color: var(--ink-2); }
.faults.loud .faults-words { color: var(--ink); font-weight: 600; }
.headline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 12px; margin-top: 4px; }
.headline .kpi-value { margin-top: 0; }
.headline .status { align-self: center; }
.g-line { position: relative; height: 16px; font-size: 12px; line-height: 16px; white-space: nowrap; color: var(--ink-2); }
.g-line span { position: absolute; }
.g-line.strong { color: var(--ink); font-weight: 500; }
.g-track { position: relative; height: 8px; margin: 8px 0; border-radius: 4px; background: var(--raised); }
.g-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--r1); border-radius: 4px 0 0 4px; }
.g-tick { position: absolute; width: 2px; margin-left: -1px; background: var(--ink); }
.g-scale { display: flex; justify-content: space-between; color: var(--ink-3); font-size: 12px; line-height: 16px; }
.shares { display: grid; gap: 4px; }
.share { display: grid; grid-template-columns: 96px minmax(0, 1fr) 48px; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.share > span:first-child { color: var(--ink-2); white-space: nowrap; }
.share > span:last-child { text-align: right; }
.share-bar i { display: block; height: 12px; min-width: 2px; background: var(--s1); border-radius: 0 2px 2px 0; }
.share-goal { display: flex; align-items: center; gap: 8px; margin: 4px 0; color: var(--ink-2); font-size: 12px; line-height: 16px; white-space: nowrap; }
.share-goal i { flex: 1 1 0; height: 1px; background: var(--axis); }
.parts-bar { display: flex; gap: 2px; height: 16px; border-radius: 4px; overflow: hidden; background: var(--raised); }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 8px; vertical-align: -2px; }
.parts td { padding: 4px 12px 4px 0; border: 0; }
.parts td:last-child { padding-right: 0; color: var(--ink-2); }
.lane { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 8px; align-items: center; margin-bottom: 4px; }
.lane > span { font-weight: 600; color: var(--ink-2); font-size: 12px; }
.lane-track { position: relative; height: 24px; background: var(--raised); border-radius: 4px; overflow: hidden; }
.lane-track i { position: absolute; top: 0; bottom: 0; min-width: 4px; }
.lane-axis { position: relative; height: 16px; margin-left: 40px; color: var(--ink-3); font-size: 12px; line-height: 16px; font-variant-numeric: tabular-nums; }
.lane-axis span { position: absolute; transform: translateX(-50%); }
.lane-axis span:first-child { transform: none; }
.lane-axis span:last-child { transform: translateX(-100%); }
.head-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: center; margin-bottom: 8px; }
.worse { font-weight: 600; color: var(--bad-ink); }

.table-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12px; line-height: 16px; padding: 8px 12px 8px 0; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th button { all: unset; cursor: pointer; }
th button:hover { color: var(--ink); }
th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--grid); vertical-align: top; white-space: nowrap; }
table.prose td { white-space: normal; }
td.wrap { white-space: normal; }
td.nowrap, table.prose td.nowrap { white-space: nowrap; }
td.name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
tr:last-child td { border-bottom: 0; }
th.num, td.num { text-align: right; }
td.mono { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; }
tr.go { cursor: pointer; }
tr.go:hover td { background: var(--raised); }
.pager { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
.empty { color: var(--ink-2); padding: 16px 0; }
.why-line { color: var(--ink-2); font-size: 12px; line-height: 16px; margin-top: 8px; max-width: 880px; }

.checks { display: grid; gap: 8px; }
.chk { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.status { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; white-space: nowrap; }
.status svg { width: 16px; height: 16px; flex: none; }
.status.ok { color: var(--good-ink); } .status.warn { color: var(--warn-ink); } .status.fail { color: var(--bad-ink); }

.summary-line { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); margin-top: 4px; }
.timeline { display: grid; gap: 0; }
.ev { display: grid; grid-template-columns: 64px 32px minmax(0, 1fr); gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--grid); align-items: baseline; }
.ev:last-child { border-bottom: 0; }
.ev .t { font-variant-numeric: tabular-nums; color: var(--ink-3); text-align: right; }
.ev .r { font-weight: 600; color: var(--ink-2); font-size: 12px; }
.ev.problem .what { font-weight: 600; }
.ev .d { color: var(--ink-2); }

.locked { max-width: 480px; margin: 96px auto; }
.sk { background: var(--raised); border-radius: 8px; animation: pulse 1.4s cubic-bezier(.22,1,.36,1) infinite alternate; }
.sk.tile { height: 112px; border-radius: 12px; }
.sk.wide { height: 240px; border-radius: 12px; }
@keyframes pulse { from { opacity: .5; } to { opacity: 1; } }

@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(var(--cols-mid, 2), minmax(0, 1fr)); }
  .grid-2.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .layout { display: block; }
  .side { position: static; height: auto; padding: 8px 16px 0; gap: 8px; overflow: visible; }
  .tabs { flex-direction: row; overflow-x: auto; padding-bottom: 8px; }
  .side-foot { display: none; }
  .brand { padding: 4px 0; }
  .main { padding: 8px 16px 48px; }
  .grid-2, .grid-2.three { grid-template-columns: minmax(0, 1fr); }
  .chk { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .input { min-width: 0; width: 100%; }
}
@media (max-width: 560px) {
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .kpis.strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis.strip.inner-strip { grid-template-columns: minmax(0, 1fr); }
  /* Sentences in five narrow columns read worse than each row stacked. What each line is needs no heading here. */
  table.rows-on-phone thead { display: none; }
  table.rows-on-phone tr { display: block; padding: 8px 0; border-bottom: 1px solid var(--grid); }
  table.rows-on-phone tr:last-child { border-bottom: 0; }
  table.rows-on-phone td { display: block; padding: 0; border: 0; text-align: left; white-space: normal; }
  table.rows-on-phone td:first-child { font-weight: 600; }
  table.rows-on-phone td.num, table.rows-on-phone td.nowrap { display: inline; margin-right: 12px; color: var(--ink-3); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<div class="layout" id="app">
  <nav class="side" aria-label="Pages">
    <div class="brand"><h1>Immortal Combat</h1><small>Admin panel</small></div>
    <ul class="tabs" id="tabs"></ul>
    <div class="side-foot">
      <button class="btn" id="theme" type="button">Switch theme</button>
      <span id="signed-out-hint">Links from /admin last 12 hours.</span>
    </div>
  </nav>
  <main class="main" id="content" tabindex="-1">
    <div class="livebar" id="live" aria-live="polite"><span class="muted">Checking the server</span></div>
    <div class="filters" id="filters"></div>
    <div id="page"></div>
  </main>
</div>

<script>
"use strict";
const TABS = [["overview", "Overview"], ["funnel", "Funnel"], ["netcode", "Netcode"], ["devices", "Devices"], ["reliability", "Reliability"],
              ["server", "Server"], ["balance", "Balance"], ["players", "Players"], ["fights", "Fights"], ["quality", "Data quality"]];
const RANGES = [[1, "24 hours"], [7, "7 days"], [30, "30 days"], [90, "90 days"], [0, "All time"]];
const SOURCE_TEXT = { server: "Server", phones: "Phones", both: "Server and phones" };
const SOURCE_WHY = { server: "Measured by the game server itself.", phones: "Reported by phones. Lost if a phone dies before its next report.", both: "Lined up from what the server and both phones recorded." };
const COLORS = ["--s1", "--s2", "--s3", "--s4", "--s5"];
const RAMP = ["--r1", "--r2", "--r3", "--r4", "--r5"];  // five steps is all the ramp can keep visibly apart; each bar is labelled
const EARLY_TABS = new Set(["overview", "funnel", "netcode", "devices", "reliability", "balance", "players"]);
// Column counts that come out even for a number of cards, wide and on a narrower screen, so none is left stranded on a row of its own
const KPI_COLUMNS = { 1: [1, 1], 2: [2, 2], 3: [3, 3], 4: [4, 2], 5: [5, 3], 6: [3, 3], 8: [4, 2], 9: [3, 3], 12: [4, 3] };
const MIN_LINE_POINTS = 3;
const LINE_POINTS = { day: "days of data", clock: "reports", time: "readings" };
const REFRESH_MS = 30000;
const LIVE_MS = 10000;

// Player names are chosen by players, so nothing from the server is ever parsed as HTML: every node is built here,
// and text only ever goes in as text
function el(tag, props, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) node.append(kid);
  return node;
}
function svg(tag, attrs, ...kids) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) node.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined) node.append(kid);
  return node;
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
  del(k) { try { localStorage.removeItem(k); } catch (_) {} },
};

// ----- sign in -----
let token = null;
(function readToken() {
  const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
  const fromLink = hash.get("key");
  if (fromLink) {
    token = fromLink;
    store.set("ic_admin_token", fromLink);
    history.replaceState(null, "", location.pathname);
  } else {

async function api(path) {

// ----- numbers -----
const dash = "–";
const singular = (label) => label === "people" ? "person" : label.replace(/s$/, "");
function fmt(v, unit) {
  if (v === null || v === undefined || (typeof v === "number" && Number.isNaN(v))) return dash;
  switch (unit) {
    case "count": return Math.round(v).toLocaleString();
    case "pct": { const p = v * 100; return (p === 0 || p === 100 ? p.toFixed(0) : p.toFixed(1)) + "%"; }
    case "pct100": return v.toFixed(0) + "%";
    case "ms": return (v >= 10000 ? (v / 1000).toFixed(1) + "s" : v < 10 ? v.toFixed(1) + "ms" : Math.round(v).toLocaleString() + "ms");
    case "secs": {
      if (v < 10) return v.toFixed(1) + "s";
      // Round first and split after, so 119.6 is 2m 0s and never 1m 60s
      const s = Math.round(v);
      if (s < 90) return s + "s";
      if (s < 3600) return `${Math.floor(s / 60)}m ${s % 60}s`;
      const m = Math.round(s / 60);
      return `${Math.floor(m / 60)}h ${m % 60}m`;
    }
    case "number": case "ratio": return v >= 100 ? Math.round(v).toLocaleString() : v >= 10 ? v.toFixed(1) : v.toFixed(2);
    case "mb": return v.toFixed(1) + " MB";
    case "time": return v ? new Date(v * 1000).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : dash;
    default: return String(v);
  }
}
function tickFmt(v, unit) {
  const compact = (x) => x >= 1e6 ? (x / 1e6).toFixed(x % 1e6 ? 1 : 0) + "M" : x >= 1000 ? (x / 1000).toFixed(x % 1000 ? 1 : 0) + "K" : String(Math.round(x * 100) / 100);
  if (unit === "ms") return v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + "s" : compact(v) + "ms";
  if (unit === "pct") return Math.round(v * 100) + "%";
  if (unit === "pct100") return Math.round(v) + "%";
  if (unit === "mb") return compact(v) + " MB";
  if (unit === "secs") return compact(v) + "s";
  return compact(v);
}
function niceScale(max, unit) {
  if (!(max > 0)) return { top: unit === "pct" ? 1 : 1, ticks: [0, 1] };
  const pow = 10 ** Math.floor(Math.log10(max));
  const n = max / pow;
  let step = (n <= 1 ? 0.2 : n <= 2 ? 0.5 : n <= 5 ? 1 : 2) * pow;
  if (unit === "count") step = Math.max(1, Math.ceil(step));
  const top = Math.ceil(max / step - 1e-9) * step;
  const ticks = [];
  for (let t = 0; t <= top + step / 2; t += step) ticks.push(Math.round(t * 1e6) / 1e6);
  return { top, ticks };
}

  if (kind === "day") {
    const [y, m, d] = String(x).split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  if (kind === "time") {
    const date = new Date(x * 1000);
    return span > 2 * 86400 ? date.toLocaleDateString(undefined, { month: "short", day: "numeric" }) : date.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });

    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }

}

// ----- charts -----
const liveCharts = new Set();

function chartBlock(block, opts) {
  const key = `chart:${block.title}`;
  const showTable = openState.has(key);
  const head = el("div", { class: "chart-head" }, el("h3", { text: block.title }),
    el("button", { class: "link small", type: "button", onclick: () => { toggleState(key); rerender(); } , text: showTable ? "Show as a chart" : "Show as a table" }));
  const card = el("div", { class: "card" }, head);
  if (showTable) {
    card.append(chartTable(block));
  } else {
    const box = el("div", { class: "chart-box" });
    card.append(box);
    const series = block.series || [];
    if (series.length > 1) {
      card.append(el("div", { class: "legend" }, series.map((s, i) => el("span", {},
        el("i", { class: block.kind === "line" ? "ln" : "", style: `background:var(${COLORS[i % COLORS.length]})` }), s.name))));
    }
    box._draw = () => drawChart(box, block);
    liveCharts.add(box);
  }
  const line = whyLine(block.why, block.source, block.n);
  if (line) card.append(line);
  return card;
}

function chartTable(block) {
  const columns = [{ key: "x", label: "", unit: "text" }, ...block.series.map((s, i) => ({ key: `s${i}`, label: s.name, unit: block.unit }))];
  let rows;
  if (block.series[0] && block.series[0].points) {
    const xs = [...new Set(block.series.flatMap((s) => s.points.map((p) => p[0])))].sort((a, b) => a - b);
    rows = xs.map((x) => {
      const row = { x: xLabel(x, block.x_kind) };
      block.series.forEach((s, i) => { const p = s.points.find((q) => q[0] === x); row[`s${i}`] = p ? p[1] : null; });
      return row;
    });
  } else {
    rows = (block.x || []).map((x, xi) => {
      const row = { x: xLabel(x, block.x_kind, spanOf(block)) };
      block.series.forEach((s, i) => { row[`s${i}`] = s.values[xi]; });
      return row;
    });
  }
  return dataTable(columns, rows, {});
}
function spanOf(block) {
  const x = block.x || [];
  return block.x_kind === "time" && x.length > 1 ? x[x.length - 1] - x[0] : 0;
}

function emptyChart(box, text) {
  box.replaceChildren(el("p", { class: "empty", text: text || "No data for this range yet." }));
}
function hasData(block) {
  // On a line a zero is a reading like any other. On bars, all zeros draw nothing.
  return (block.series || []).some((s) => s.points ? s.points.some((p) => p[1] !== null) : (s.values || []).some((v) => v !== null && (block.kind === "line" || v !== 0)));
}

function drawChart(box, block) {
  if (!box.isConnected) { liveCharts.delete(box); return; }
  if (!hasData(block)) return emptyChart(box);
  if (block.kind === "shares") return drawShares(box, block);
  const width = Math.max(240, box.clientWidth);
  if (block.kind === "line") return drawLine(box, block, width);
  if (block.kind === "stackbar" || block.kind === "funnel") return drawHBars(box, block, width);
  return drawColumns(box, block, width);
}

function makeTip(box) {
  const tip = el("div", { class: "tip", role: "status" });
  box.append(tip);
  return tip;
}
function showTip(box, tip, title, rows, x, y) {
  tip.replaceChildren(el("div", { class: "tx", text: title }), ...rows.map((r) => el("div", { class: "tr" },
    r.color ? el("i", { style: `background:var(${r.color})` }) : null, el("b", { text: r.value }), r.name ? el("span", { text: r.name }) : null)));
  tip.classList.add("on");
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(0, Math.min(box.clientWidth - w, x + 12)) + "px";
  tip.style.top = Math.max(0, y - h - 8) + "px";

function axes(root, scale, x0, x1, y0, h, unit) {

    root.append(svg("line", { x1: x0, x2: x1, y1: y, y2: y, stroke: t === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
    const label = svg("text", { x: x0 - 8, y: y + 4, "text-anchor": "end" });
    label.textContent = tickFmt(t, unit);

}
function barPath(x, y, w, h, r) {

}

function drawShares(box, block) {
  const biggest = Math.max(...block.rows.map((r) => r.value));
  const nodes = [];
  block.rows.forEach((r, i) => {
    if (r.over_goal && !(i && block.rows[i - 1].over_goal)) nodes.push(el("div", { class: "share-goal" }, el("span", { text: `Over the ${block.goal}ms goal` }), el("i")));
    nodes.push(el("div", { class: "share" }, el("span", { text: r.label }),
      el("div", { class: "share-bar" }, el("i", { style: `width:${(r.value / biggest * 100).toFixed(1)}%` })),
      el("span", { text: r.value < 0.001 ? "<0.1%" : fmt(r.value, "pct") })));

function drawColumns(box, block, width) {
  const H = block.compact ? 144 : 220, left = 52, right = 8, top = 8, bottom = 24;
  const plotW = width - left - right, plotH = H - top - bottom;
  const x = block.x, n = x.length;
  const totals = x.map((_, i) => block.series.reduce((sum, s) => sum + (s.values[i] || 0), 0));
  const scale = niceScale(Math.max(...totals), block.unit);
  const root = svg("svg", { width, height: H, viewBox: `0 0 ${width} ${H}`, role: "img", "aria-label": block.title });
  axes(root, scale, left, width - right, top, plotH, block.unit);
  const band = plotW / n;
  const barW = Math.min(24, Math.max(2, band - Math.min(8, band * 0.3)));
  const span = spanOf(block);
  const labelEvery = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(plotW / 72))));
  box.replaceChildren(root);
  const tip = makeTip(box);
  x.forEach((xi, i) => {
    const cx = left + band * (i + 0.5);
    let base = top + plotH;
    const topSeries = block.series.reduce((last, s, si) => (s.values[i] ? si : last), -1);
    block.series.forEach((s, si) => {
      const v = s.values[i] || 0;

      const fullH = (v / scale.top) * plotH;
      const h = Math.max(1, fullH - (block.series.length > 1 && si < topSeries ? 2 : 0));
      const y = base - h;
      root.append(si === topSeries ? svg("path", { d: barPath(cx - barW / 2, y, barW, h, 4), fill: `var(${COLORS[si % COLORS.length]})` })

      base -= fullH;

      label.textContent = xLabel(xi, block.x_kind, span);
      root.append(label);

    const hit = svg("rect", { x: left + band * i, y: top, width: band, height: plotH, fill: "transparent", tabindex: n <= 40 ? 0 : null, "aria-label": `${xLabel(xi, block.x_kind, span)}: ${block.series.map((s) => `${s.name} ${fmt(s.values[i], block.unit)}`).join(", ")}` });

      name: block.series.length > 1 ? s.name : "", value: fmt(s.values[i] || 0, block.unit), color: block.series.length > 1 ? COLORS[block.series.indexOf(s) % COLORS.length] : COLORS[0] })), cx, base);
    hit.addEventListener("pointermove", show);
    hit.addEventListener("focus", show);
    hit.addEventListener("pointerleave", () => hideTip(tip));
    hit.addEventListener("blur", () => hideTip(tip));
    root.append(hit);

}

function drawHBars(box, block, width) {
  const rowH = 32, left = Math.min(180, Math.max(96, width * 0.28)), right = 96, top = 4;
  const x = block.x;
  const H = top + x.length * rowH + 4;
  const plotW = Math.max(40, width - left - right);
  const funnel = block.kind === "funnel";
  const totals = x.map((_, i) => block.series.reduce((sum, s) => sum + (s.values[i] || 0), 0));
  const max = Math.max(...totals, 0) || 1;
  const root = svg("svg", { width, height: H, viewBox: `0 0 ${width} ${H}`, role: "img", "aria-label": block.title });
  box.replaceChildren(root);
  const tip = makeTip(box);
  x.forEach((xi, i) => {
    const y = top + i * rowH + 6, barH = 20;
    const label = svg("text", { x: left - 8, y: y + 14, "text-anchor": "end" });
    label.textContent = xLabel(xi, block.x_kind);
    root.append(label);
    root.append(svg("line", { x1: left, x2: left, y1: y - 6, y2: y + barH + 6, stroke: "var(--axis)" }));
    let at = left;
    block.series.forEach((s, si) => {
      const v = s.values[i] || 0;
      if (!v) return;
      const w = Math.max(1, (v / max) * plotW);
      const color = funnel ? RAMP[Math.min(i, RAMP.length - 1)] : COLORS[si % COLORS.length];
      root.append(svg("rect", { x: at, y, width: Math.max(1, w - (block.series.length > 1 ? 2 : 0)), height: barH, rx: si === block.series.length - 1 ? 4 : 0, fill: `var(${color})` }));

    root.append(tag);
    const hit = svg("rect", { x: 0, y: y - 6, width, height: rowH, fill: "transparent", tabindex: 0, "aria-label": `${xi}: ${fmt(totals[i], block.unit)}` });
    const show = () => showTip(box, tip, String(xi), block.series.map((s, si) => ({ name: block.series.length > 1 ? s.name : "", value: fmt(s.values[i] || 0, block.unit), color: funnel ? RAMP[Math.min(i, RAMP.length - 1)] : COLORS[si % COLORS.length] })), left, y + 4);
    hit.addEventListener("pointermove", show);
    hit.addEventListener("focus", show);

function drawLine(box, block, width) {
  const H = 220, left = 52, right = 12, top = 8, bottom = 24;
  const plotW = width - left - right, plotH = H - top - bottom;
  const numeric = block.x_kind === "time" || block.x_kind === "clock";
  const series = block.series.map((s) => ({ name: s.name, points: s.points || s.values.map((v, i) => [numeric ? block.x[i] : i, v]) }));
  const allX = series.flatMap((s) => s.points.map((p) => p[0]));
  const minX = Math.min(...allX), maxX = Math.max(...allX);
  const labelOf = (v) => numeric ? xLabel(v, block.x_kind, maxX - minX) : xLabel(block.x[v], block.x_kind);
  // A line needs a few points to be a trend. Before then the numbers say more than a lone dot does.
  const readings = series.map((s) => s.points.filter((p) => p[1] !== null && p[1] !== undefined));
  if (new Set(readings.flat().map((p) => p[0])).size < MIN_LINE_POINTS) {
    box.replaceChildren(el("p", {}, readings.map((points, i) => points.length ? el("div", { text: `${series.length > 1 ? `${series[i].name}: ` : ""}${points.map((p) => `${fmt(p[1], block.unit)} ${block.x_kind === "day" ? "on" : "at"} ${labelOf(p[0])}`).join(", ")}` }) : null)),
      el("p", { class: "why-line", text: `The chart appears from ${MIN_LINE_POINTS} ${LINE_POINTS[block.x_kind] || "readings"}.` }));
    box.parentElement.querySelector(".legend")?.remove();
    return;
  }
  const xOf = (v) => left + (maxX === minX ? plotW / 2 : ((v - minX) / (maxX - minX)) * plotW);
  const scale = niceScale(Math.max(...series.flatMap((s) => s.points.map((p) => p[1] || 0))), block.unit);
  const yOf = (v) => top + plotH - (v / scale.top) * plotH;
  const root = svg("svg", { width, height: H, viewBox: `0 0 ${width} ${H}`, role: "img", "aria-label": block.title });
  axes(root, scale, left, width - right, top, plotH, block.unit);
  const labels = Math.max(2, Math.floor(plotW / 96));
  const uniqueX = [...new Set(allX)].sort((a, b) => a - b);
  const every = Math.max(1, Math.ceil(uniqueX.length / labels));
  uniqueX.forEach((v, i) => {
    if (i % every) return;
    const label = svg("text", { x: xOf(v), y: H - 8, "text-anchor": "middle" });
    label.textContent = labelOf(v);
    root.append(label);

  series.forEach((s, si) => {
    const color = `var(${COLORS[si % COLORS.length]})`;
    let d = "", pen = false;
    s.points.forEach(([x, y]) => {

      pen = true;

    root.append(svg("path", { d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const known = s.points.filter((p) => p[1] !== null && p[1] !== undefined);
    const last = known[known.length - 1];
    if (last) root.append(svg("circle", { cx: xOf(last[0]), cy: yOf(last[1]), r: 4, fill: color, stroke: "var(--surface)", "stroke-width": 2 }));

    });

  root.append(cross);

  let at = uniqueX.length - 1;

    at = Math.max(0, Math.min(uniqueX.length - 1, index));

    cross.setAttribute("x2", xOf(v));

      const near = s.points.reduce((best, p) => (!best || Math.abs(p[0] - v) < Math.abs(best[0] - v) ? p : best), null);
      return { name: series.length > 1 ? s.name : "", value: fmt(near ? near[1] : null, block.unit), color: COLORS[si % COLORS.length] };
    });

  const hit = svg("rect", { x: left, y: top, width: plotW, height: plotH, fill: "transparent", tabindex: 0, "aria-label": `${block.title}. Use the arrow keys to read values.` });
  hit.addEventListener("pointermove", (e) => {
    const rect = root.getBoundingClientRect();
    const px = e.clientX - rect.left;

    if (e.key === "ArrowRight") { showAt(at + 1); e.preventDefault(); }

}

// ----- blocks -----
const openState = new Set();

function whyLine(why, source, n) {

}

const isSmall = (item, lowSample) => item.n !== null && item.n !== undefined && item.n > 0 && item.n < lowSample;

  return el("details", { class: "why", open: openState.has(key) || null, ontoggle: (e) => { if (e.target.open) openState.add(key); else openState.delete(key); } },
    el("summary", { text: "How this is worked out" }), el("p", { text: item.why }), el("p", { text: SOURCE_WHY[item.source] }));
}
function kpiValue(item) {

}

    el("div", { class: "kpi-label", text: item.label }),

// The same number without a card of its own, for a row of context held in one card
function kpiCell(item, lowSample) {

      el("div", { class: "lane-axis" }, el("span", { style: "left:0", text: "0:00" }), ticks.map((t) => el("span", { style: `left:${at(t)}%`, text: clock(t) })), el("span", { style: "left:100%", text: clock(story.span) }))),
    el("div", { class: "legend" }, el("span", {}, el("i", { style: "background:var(--s2)" }), "Its own frame froze"), el("span", {}, el("i", { style: "background:var(--s1)" }), "Waiting for the opponent")),
    story.unlisted ? el("p", { class: "why-line", text: `${story.unlisted.toLocaleString()} more ${story.unlisted === 1 ? "freeze was" : "freezes were"} counted but not drawn: a phone report lists at most 20.` }) : null,
    story.paused ? el("p", { class: "why-line", text: `The strip runs on the clock, so it includes the ${fmt(story.paused, "secs")} the bout stood frozen with a player gone.` }) : null,

}

function renderFight(data) {
  liveCharts.clear();
  const f = data.fight;
  const zero = f.fight_started_at || f.created_at;
  const title = `${f.p1_name || "P1"} (${heroOr(f.heroes[0])}) vs ${f.p2_name || "P2"} (${heroOr(f.heroes[1])})`;
  const result = f.outcome === "running" ? "Still running" : f.finish_reason === "DRAW" ? "Draw" : f.finish_reason === "AUTOWIN_DISCONNECT" ? "Won by forfeit" : f.finish_reason === "KNOCKOUT" ? "Won on rounds" : f.finish_reason || f.status;
  const winner = f.winner_id ? (f.winner_id === f.p1_id ? f.p1_name : f.p2_name) : null;
  const facts = [
    `${result}${winner ? `: ${winner}` : ""}`, f.p1_rounds !== null ? `${f.p1_rounds ?? 0} to ${f.p2_rounds ?? 0}` : null,
    f.active_secs !== null ? `Fought for ${fmt(f.active_secs, "secs")}` : null, f.paused_secs ? `Frozen for ${fmt(f.paused_secs, "secs")}` : null,
    f.segment ? `Restarted ${f.segment} time${f.segment > 1 ? "s" : ""}` : null, f.stage !== null ? `Arena ${f.stage + 1}` : null,
    f.source, f.build ? `Build ${f.build}` : null,

  const nodes = [
    el("button", { class: "link", type: "button", text: "Back to all fights", onclick: () => { location.hash = "fights"; } }),
    el("section", { class: "block", style: "margin-top:8px" },
      el("h2", { text: title }),
      el("div", { class: "summary-line" }, facts.map((t) => el("span", { text: t }))),
      el("div", { class: "summary-line" }, el("span", { class: "muted", text: `${f.match_id}, ${fmt(f.fight_started_at || f.created_at, "time")}` }),
        f.has_replay ? el("a", { href: `/player/play.html?replay=${encodeURIComponent(f.match_id)}`, target: "_blank", rel: "noopener", text: "Watch the replay" }) : null,
        f.rematch ? el("a", { href: `#fight/${encodeURIComponent(f.rematch)}`, text: "Rematch" }) : null,
        f.rematch_of ? el("a", { href: `#fight/${encodeURIComponent(f.rematch_of)}`, text: "Match before this" }) : null)),
  ];

  if (!f.fight_started_at) nodes.push(el("div", { class: "card" }, el("p", { text: "No fight started in this match. The timeline shows how far it got." })));

  // What happened: the story first, then the same moments in order
  const story = data.story;
  const lanesDrawn = story && (story.lanes.p1.length || story.lanes.p2.length);
  const causeRows = Object.entries(data.causes || {});
  const problems = data.timeline.filter((e) => e.problem);
  const allKey = `all_events:${f.match_id}`;
  const problemsOnly = problems.length > 0 && !openState.has(allKey);
  const items = problemsOnly ? problems : data.timeline;
  const happened = [];
  if (lanesDrawn || causeRows.length) {
    happened.push(el("div", { class: "card" }, lanesDrawn ? lanesBlock(story) : null,
      causeRows.length ? el("div", { style: "margin-top:12px" }, dataTable([{ key: "cause", label: "Likely cause", unit: "text" }, { key: "count", label: "Freezes", unit: "count" }],
        causeRows.map(([k, v]) => ({ cause: data.cause_labels[k] || k, count: v })), {})) : null,
      el("p", { class: "why-line", text: "Server and phones. In live rounds only. A freeze that shows on both phones counts on each. Lining up both phones' reports with what the server received, to within about 300ms." })));
  }
  happened.push(el("div", { class: "card" },
    el("div", { class: "head-row" }, el("h3", { text: "Timeline" }),
      problems.length ? el("label", { class: "check" }, el("input", { type: "checkbox", checked: problemsOnly || null, onchange: () => { toggleState(allKey); rerender(); } }), "Only what went wrong") : null),
    items.length ? el("div", { class: "timeline" }, items.map((e) => el("div", { class: `ev${e.problem ? " problem" : ""}` },
      el("span", { class: "t", text: e.t < 0 ? `\u2212${xLabel(-e.t, "clock")}` : xLabel(e.t, "clock") }),
      el("span", { class: "r", text: e.role ? e.role.toUpperCase() : "" }),
      el("span", {}, e.who ? `${e.who} ` : "", el("span", { class: "what", text: e.text }), e.detail ? el("span", { class: "d", text: `: ${e.detail}` }) : null)))) : el("p", { class: "empty", text: "Nothing to show." }),
    el("p", { class: "why-line", text: `${items.length.toLocaleString()} of ${data.timeline.length.toLocaleString()} events. Times are minutes and seconds from the start of the fight, on the server's clock; a minus sign means before it. Freezes come from phones and are placed to within about a network trip.` })));
  nodes.push(el("section", { class: "block" }, el("h2", { text: "What happened" }), story ? el("p", { class: "note", style: "margin:4px 0 0", text: story.sentence }) : null, el("div", { class: "stack" }, happened)));

  const sideGroups = [
    ["Freezes", [["Freezes waiting for the opponent", "stall_freezes", "count"], ["Freezes from its own slow frames", "hitch_freezes", "count"], ["Freezes outside rounds", "freezes_other", "count"],
                 ["Stalls", "stalls", "count"], ["Time stalled", "stall_ms", "ms"], ["Longest stall", "max_stall_ms", "ms"], ["Waiting for the opponent to load", "load_wait_ms", "ms"]]],
    ["The phone itself", [["Phone", "platform", "text"], ["Device", "device", "text"], ["Average frame", "frame_ms", "ms"], ["Worst frame", "worst_frame", "ms"],
                          ["Slow frames in rounds", "slow_share", "pct"], ["Main thread busy", "busy", "pct"], ["Game loop errors", "errors", "count"]]],
    ["Connection", [["Connection when last reported", "transport", "text"], ["Speed, ticks a second (60 is full)", "speed", "number"], ["Input delay", "delay_ms", "ms"],
                    ["Opponent round trip", "peer_rtt", "ms"], ["Server round trip", "server_rtt", "ms"], ["Inputs first by UDP", "inputs_udp", "pct"]]],
    ["Rollback and reporting", [["Rollbacks", "rollbacks", "count"], ["Deepest rollback", "max_rollback_ms", "ms"], ["Fight time reported", "reported_secs", "secs"], ["Share of the fight reported", "coverage", "pct"]]],
  ];
  const p1 = data.sides.p1 || {}, p2 = data.sides.p2 || {};
  if (data.sides.p1 || data.sides.p2) {
    const cell = (side, role, key, unit) => el("td", { class: `num wrap${data.worse[key] === role ? " worse" : ""}`, text: unit === "text" ? (side[key] ?? dash) : fmt(side[key], unit) });
    nodes.push(el("section", { class: "block" }, el("h2", { text: "How it ran on each phone" }),
      el("p", { class: "note", style: "margin:4px 0 0", text: `From phone reports. P1 is ${f.p1_name || "unnamed"}, P2 is ${f.p2_name || "unnamed"}. Marked values are where one phone did clearly worse: at least double the other, and bad enough to matter.` }),
      el("div", { class: "grid-2", style: "margin-top:12px" }, sideGroups.map(([title, rows]) => el("div", { class: "card" }, el("div", { class: "table-wrap" }, el("table", {},
        el("thead", {}, el("tr", {}, el("th", { scope: "col", style: "color:var(--ink);font-size:14px;line-height:20px;font-weight:600", text: title }), el("th", { class: "num", scope: "col", text: "P1" }), el("th", { class: "num", scope: "col", text: "P2" }))),
        el("tbody", {}, rows.map(([label, key, unit]) => el("tr", {}, el("td", { class: "wrap", text: label }), cell(p1, "p1", key, unit), cell(p2, "p2", key, unit)))))))))));
  } else if (f.fight_started_at) {
    nodes.push(el("div", { class: "card", style: "margin-bottom:40px" }, el("h3", { text: "No phone reports for this fight" }),
      el("p", { class: "why-line", text: "Reports go out every 10 seconds and when a fight ends. A fight this short, or phones that lost their connection, send none. The timeline above is the server's own record." })));
  }

  const lines = [["Worst frame per report", "max_frame_ms", "ms"], ["Time stalled per report", "stall_ms", "ms"], ["Opponent round trip", "peer_rtt", "ms"], ["Rollbacks per report", "rollbacks", "count"], ["Input delay", "delay", "ms"]]
    .filter(([, key]) => (data.lines[key] || []).length);
  if (lines.length) {
    const key = "reports";
    const show = openState.has(key);
    nodes.push(el("section", { class: "block" }, el("h2", { text: "Over the fight" }), el("p", { class: "note", text: "One point for each report a phone sent, at minutes and seconds into the fight." }),
      el("div", { class: "grid-2 three", style: "margin-top:12px" }, lines.map(([title, lineKey, unit]) => chartBlock({
        title, kind: "line", series: data.lines[lineKey], unit, x_kind: "clock", source: null, why: null,
      })),
      el("div", { class: `card${show ? " wide" : ""}` }, el("h3", { text: "Raw phone reports", style: "margin-bottom:8px" }),
        el("button", { class: "link", type: "button", text: show ? "Hide reports" : `Show ${data.windows.length} reports`, onclick: () => { toggleState(key); rerender(); } }),
        show ? dataTable([{ key: "role", label: "Phone", unit: "text" }, { key: "t", label: "At", unit: "text" }, { key: "segment", label: "Segment", unit: "count" }, { key: "seq", label: "Number", unit: "count" }, { key: "reason", label: "Sent because", unit: "text" },
                          { key: "secs", label: "Wall clock", unit: "secs" }, { key: "active_secs", label: "Fight time", unit: "secs" }, { key: "paused_ms", label: "Paused", unit: "ms" }, { key: "hidden_ms", label: "Hidden", unit: "ms" }, { key: "ticks", label: "Ticks", unit: "count" },
                          { key: "delay", label: "Delay, ticks", unit: "count" }, { key: "peer_rtt", label: "Round trip", unit: "ms" }, { key: "stalls", label: "Stalls", unit: "count" }, { key: "stall_ms", label: "Stalled", unit: "ms" }, { key: "rollbacks", label: "Rollbacks", unit: "count" }, { key: "max_frame_ms", label: "Worst frame", unit: "ms" }],
          data.windows.map((w) => ({ ...w, t: xLabel(w.received_at - zero, "clock") })), {}) : null))));
  }
  showPage(nodes);
  filtersEl.replaceChildren();
}

async function loadFight(seq) {
  if (!lastFight || lastFight.fight.match_id !== state.fight) { skeleton(); filtersEl.replaceChildren(); }
  try {
    const data = await apiJson(`/api/admin/fight/${encodeURIComponent(state.fight)}`);
    if (seq !== loadSeq) return;
    lastFight = data;
    renderFight(data);
  } catch (err) {
    if (seq !== loadSeq || err.message === "signed out") return;
    pageEl.replaceChildren(el("div", { class: "card" }, el("h3", { text: "This fight couldn't load" }), el("p", { class: "why-line", text: err.message }),
      el("button", { class: "btn", type: "button", style: "margin-top:12px", text: "Back to all fights", onclick: () => { location.hash = "fights"; } })));
  }
}

// ----- live strip -----
let lastLive = null;
async function loadLive() {
  const bar = document.getElementById("live");
  try {
    const live = await apiJson("/api/admin/live");
    const hadFights = lastLive && lastLive.fights.length;
    lastLive = live;
    const up = live.uptime_secs;
    bar.replaceChildren(
      el("span", {}, el("i", { class: "dot" }), el("b", { text: `${live.live_fights} fighting now` })),
      el("span", { text: `${live.players} players connected` }), el("span", { text: `${live.spectators} watching` }), el("span", { text: `${live.waiting} challenges open` }),
      el("span", { class: "muted", text: `Up for ${fmt(up, "secs")}` }), el("span", { class: "muted", text: `Build ${live.build}` }));
    if (!state.fight && state.tab === "overview" && lastData && lastData.tab === "overview" && (hadFights || live.fights.length)) rerender();
  } catch (err) {
    if (err.message === "signed out") return;
    bar.replaceChildren(el("span", {}, el("i", { class: "dot off" }), el("b", { text: "Can't reach the server" })), el("span", { class: "muted", text: "Numbers below may be out of date." }));
  }
}

// ----- moving around -----
function route() {
  const hash = location.hash.replace(/^#/, "");
  if (hash.startsWith("fight/")) {
    state.fight = decodeURIComponent(hash.slice(6));
  } else {
    state.fight = null;
    state.tab = TABS.some(([id]) => id === hash) ? hash : "overview";
  }
  window.scrollTo(0, 0);
  load();
}
window.addEventListener("hashchange", route);

document.getElementById("theme").addEventListener("click", () => {
  const dark = getComputedStyle(document.documentElement).colorScheme.includes("dark");
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  store.set("ic_admin_theme", dark ? "light" : "dark");
  liveCharts.forEach((box) => box._draw && box._draw());
});
const savedTheme = store.get("ic_admin_theme");
if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

if (!token) {
  showLocked();
} else {
  route();
  loadLive();
  refreshTimer = setInterval(() => { if (!document.hidden && !state.fight) load(true); }, REFRESH_MS);
  liveTimer = setInterval(() => { if (!document.hidden) loadLive(); }, LIVE_MS);
}
</script>
