<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        /* Everything drawn around the game borrows the game's own look: its pitch-black
           background, its white pixel font (the A / B / D glyphs are cut from the game's own
           text), its stone menu bars and its red selected text. The d-pad is a cross cut
           from that stone and the keys are solid blocks of it that sink when pressed. */
        :root {
            --ink: #000000;
            --stone-side: #2e2a20;
            --stone-edge: #0c0a08;
            --stone-cap: #1c1d22;
            --stone-mid: #444133;
            --stone: #6b6554;
            --stone-hi: #a6a191;
            --stone-glint: #cfccc4;
            --fire-red: #ef4624;
            --fire: #f68f29;
            --fire-yellow: #fccf25;
            --fire-pale: #fee67a;
            --pad-size: 168px;
            --key-edge: 6px;
            --key-depth: 7px;
            --cross-edge: 5px;
            --cross-depth: 6px;
            --glyph-a: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAkAAAAKCAYAAABmBXS+AAAAdElEQVR42oWPsQmAUBBD33cEcQFbV9E5dBkXcARncAXBzhWsbFwgFp7+jx4YCEdC4JIgiRc+RvYXAPbMCcxAA4ymeyShiMk0kg7z6mCdvDc3qiCnedoHKNJOMxCMnXmLt+7GYHd9h0onvF2745JWUp6se3gCOhxTCYRjKvwAAAAASUVORK5CYII=");
            --glyph-a-red: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAkAAAAKCAYAAABmBXS+AAAAbUlEQVR42mP8z4ABMISYCClgYGB4y4RFwRkGBgYfBgaGlVB+D8N/iOx/KN4N5TP8Z2D4BBXzZvyP2xoY0EI2BRt+8x/N4WcYGBgYoTgdKnYem+9gYCaUvoauSBGL4udwF0N9kvafgUEIyXdwDAAcZDcPCGC1zwAAAABJRU5ErkJggg==");
            --glyph-b: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAkAAAAKCAYAAABmBXS+AAAAaklEQVR42oWQuw2AUAwD7yEGQGIEKhahYRhaRmIH9qBiBWY4miCe+LqypTgXJakA8q5U8K8WFU/1kfvIq0r50FyBJvwAUGT3bEAHVLdahpoDRWBUJ5X88CXzB66+bnrSqH4OjQe+BNLfp3aJS4wVuLkUIwAAAABJRU5ErkJggg==");
            --glyph-b-red: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAkAAAAKCAYAAABmBXS+AAAAbElEQVR42o2QwQmAMAxFX8UBBEfw5CJeOozXjuQO7uGpKzjD9+AvFC3oh5AEkv9CggDAqanQ8a0Z3TZyRPfRfRbQNzYzMLleAbrqnhNYgOG1VqF2ozBGgk12KjqquuDGp1Mrkj6GUsEH/XjUBVeCQ1oVLqvwAAAAAElFTkSuQmCC");
            --glyph-d: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAkAAAAKCAYAAABmBXS+AAAAbUlEQVR42oWPsQ2AMAwEP4gJWIGKPehYKGuwBUNQswFUjEDFAkfjgGUhOCnS53WxlQTIuEMgVT+CJE1VKGZJyc5sXRulzeW+hCitL+sWAeJhCPcTaLx0AA2wOykD8q8i2Qa8SiPQFQFQbd/95AI/F4tbshWLuAAAAABJRU5ErkJggg==");
            --glyph-d-red: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAkAAAAKCAYAAABmBXS+AAAAb0lEQVR42oWQwQ2AIBAEB0ugBV/24c+GaMMuLIK3HejLEnzZwPoQDFyIbrLJcsyFO5x4VcRKrvsBAJbOFCLgkmOq9RbaizzmYKGt8dyKnoGUPJnzJfAldAq84CigIOou66C8duNyFgwZEOC+PijrBmt8QqDoJOH1AAAAAElFTkSuQmCC");
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--ink);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: var(--ink);
            position: relative;
            overflow: hidden;
        }

        /* --- SCREEN: KEEPS THE 352:416 RATIO AND FITS BY WIDTH --- */
        #screen-wrapper {
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            background: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        #screen-container {
            width: auto;
            height: auto;
            aspect-ratio: 352 / 416;
            max-height: 100%;
            max-width: 100%;
            margin: auto;
            position: relative;
            background: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #display {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-color: var(--ink);
        }

        #display:focus {
            outline: none;
        }

        /* --- LOADING SCREEN: STONE FRAME FILLED WITH THE MENU ARROW'S FIRE GRADIENT --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--ink);
            z-index: 99999;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .progress-bar-wrap {
            width: 320px;
            max-width: 85vw;
            height: 18px;
            background: var(--ink);
            border: 3px solid;
            border-color: var(--stone-cap) var(--stone-glint) var(--stone-hi) var(--stone);
            overflow: hidden;
        }

        #progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--fire-red) 0%, var(--fire) 40%, var(--fire-yellow) 75%, var(--fire-pale) 100%);
            transition: width 0.1s linear;
        }

        /* --- CONTROLS: THE GAME'S BLACK, NO DIVIDER, NO PANEL --- */
        .mobile-controls-panel {
            flex: 0 0 auto;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 14px calc(14px + env(safe-area-inset-bottom, 0px));
            background: var(--ink);
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Shared by every on-screen key: a bare target with no chrome of its own */
        .btn-mk {
            position: relative;
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            border: 0;
            border-radius: 0;
            outline: none;
            color: #ffffff;
            font: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- IN-GAME SOFTKEYS (OPTNS / BACK / PAUSE) ---
           The game draws its softkey icons at canvas x 9-30 (left) and 321-342 (right), y 390-411.
           Each target covers its icon plus the corner around it (56 x 48 canvas px, flush with the
           bottom corner). Pressing shades the round icon as if it were pushed in. */
        .on-screen-softkey {
            position: absolute;
            bottom: 0;
            width: calc(56 / 352 * 100%);
            height: calc(48 / 416 * 100%);
            z-index: 20;
            cursor: pointer;
            background: transparent;
            border: none;
            outline: none;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .softkey-left {
            left: 0;
            --icon-x: calc(20 / 56 * 100%);
        }

        .softkey-right {
            right: 0;
            --icon-x: calc(36 / 56 * 100%);
        }

        /* A 22px disc over the 22px icon: a shadow along its top rim and a darker face read as a pushed-in button */
        .softkey-press {
            position: absolute;
            left: var(--icon-x);
            top: calc(33 / 48 * 100%);
            width: calc(22 / 56 * 100%);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 65%, rgba(0, 0, 0, 0.2) 0 45%, rgba(0, 0, 0, 0.6) 100%);
            box-shadow: inset 0 3px 3px rgba(0, 0, 0, 0.85);
            transform: translate(-50%, -50%) scale(0.85);
            opacity: 0;
            pointer-events: none;
            transition: opacity 140ms ease-out, transform 140ms ease-out;
        }

        .on-screen-softkey:active .softkey-press,
        .on-screen-softkey.active .softkey-press {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            transition-duration: 40ms;
        }

        /* --- MAIN ROW: D-PAD (LEFT) + A / B / D KEYS (RIGHT) --- */
        .main-pad-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            width: 100%;
            max-width: 372px;
            margin: 0 auto;
        }

        /* --- 1. D-PAD: A PLUS SHAPE CUT FROM THE MENU-BAR STONE ---
           #dpad-grid stays flat because it is the touch area: the touch code measures every direction from
           its centre. The cross inside it is a 3 x 3 grid. The four edge cells are the stone arms, the four
           corner cells are the invisible diagonals, and the middle cell is the stud (tapping it is OK). */
        .dpad-8-grid {
            width: var(--pad-size);
            height: var(--pad-size);
            touch-action: none;
            flex-shrink: 0;
            position: relative;
            --dx: 0;
            --dy: 0;
        }

        /* The cross stands on its own side wall and rocks toward the held direction. The touch code sets
           --dx / --dy to the direction (-1..1 each) and data-active to its name. */
        .dpad-cross {
            position: absolute;
            inset: 2px 6px 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            pointer-events: none;
            filter: drop-shadow(0 var(--cross-depth) 0 var(--stone-side));
            transform: perspective(420px) rotateX(calc(var(--dy) * -7deg)) rotateY(calc(var(--dx) * 7deg));
            transition: transform 170ms cubic-bezier(0.3, 1.6, 0.5, 1);
        }

        /* Arms and middle share the menu bar's checker fill. Each arm has the raised bevel on its three
           outer sides only, so the five cells read as one carved shape. */
        .dpad-arm,
        .dpad-hub {
            width: 100%;
            height: 100%;
            padding: 0;
            background: repeating-conic-gradient(var(--stone-mid) 0 25%, var(--ink) 0 50%) 0 0 / 2px 2px;
            border: 0 solid;
            border-color: var(--stone-glint) var(--stone) var(--stone-mid) var(--stone-hi);
            transition: border-color 100ms ease-out, box-shadow 100ms ease-out;
        }

        .dpad-arm[data-dir="up"]    { border-width: var(--cross-edge) var(--cross-edge) 0 var(--cross-edge); }
        .dpad-arm[data-dir="left"]  { border-width: var(--cross-edge) 0 var(--cross-edge) var(--cross-edge); }
        .dpad-arm[data-dir="right"] { border-width: var(--cross-edge) var(--cross-edge) var(--cross-edge) 0; }
        .dpad-arm[data-dir="down"]  { border-width: 0 var(--cross-edge) var(--cross-edge) var(--cross-edge); }

        .dpad-corner {
            width: 100%;
            height: 100%;
            padding: 0;
        }

        /* Pixel triangle on each arm, pointing outward */
        .dpad-tri {
            display: block;
            width: 18px;
            height: 11px;
            background: var(--stone-glint);
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
            transition: background-color 80ms ease-out;
        }

        .dpad-arm[data-dir="right"] .dpad-tri { transform: rotate(90deg); }
        .dpad-arm[data-dir="down"]  .dpad-tri { transform: rotate(180deg); }
        .dpad-arm[data-dir="left"]  .dpad-tri { transform: rotate(-90deg); }

        /* Held: the arm flips to the game's sunken bar look, darkens, and its triangle turns the game's red.
           A diagonal holds both of its arms (up-left lights up and left). */
        .dpad-8-grid[data-active^="up"]   .dpad-arm[data-dir="up"],
        .dpad-8-grid[data-active^="down"] .dpad-arm[data-dir="down"],
        .dpad-8-grid[data-active$="left"]  .dpad-arm[data-dir="left"],
        .dpad-8-grid[data-active$="right"] .dpad-arm[data-dir="right"],
        .dpad-arm.active {
            border-color: var(--stone-edge) var(--stone-glint) var(--stone-hi) var(--stone-cap);
            box-shadow: inset 0 0 0 40px rgba(0, 0, 0, 0.38);
            transition-duration: 45ms;
        }

        .dpad-8-grid[data-active^="up"]   .dpad-arm[data-dir="up"] .dpad-tri,
        .dpad-8-grid[data-active^="down"] .dpad-arm[data-dir="down"] .dpad-tri,
        .dpad-8-grid[data-active$="left"]  .dpad-arm[data-dir="left"] .dpad-tri,
        .dpad-8-grid[data-active$="right"] .dpad-arm[data-dir="right"] .dpad-tri,
        .dpad-arm.active .dpad-tri {
            background: #ff0000;
        }

        .dpad-hub {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dpad-stud {
            width: 14px;
            height: 14px;
            background: repeating-conic-gradient(var(--stone-mid) 0 25%, var(--ink) 0 50%) 0 0 / 2px 2px;
            border: 3px solid;
            border-color: var(--stone-edge) var(--stone-glint) var(--stone-hi) var(--stone-cap);
        }

        /* --- 2. A / B / D KEYS: THE GAME'S MAIN-MENU BAR (DARK TOP, CHECKER FILL, LIGHT LIP) --- */
        .combat-grid {
            width: var(--pad-size);
            height: var(--pad-size);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            touch-action: none;
            flex-shrink: 0;
        }

        /* At rest the bar is a raised stone key, lit from the top left, standing on its side wall. Pressed,
           it sinks onto the wall and its edges flip to the game's own sunken menu bar; letting go springs it
           back up. */
        .combat-btn {
            width: 100%;
            height: 100%;
            padding: 0;
            background: repeating-conic-gradient(var(--stone-mid) 0 25%, var(--ink) 0 50%) 0 0 / 2px 2px;
            border-style: solid;
            border-width: var(--key-edge);
            border-color: var(--stone-glint) var(--stone) var(--stone-mid) var(--stone-hi);
            box-shadow: 0 var(--key-depth) 0 var(--stone-side);
            transition:
                transform 170ms cubic-bezier(0.3, 1.6, 0.5, 1),
                box-shadow 170ms cubic-bezier(0.3, 1.6, 0.5, 1),
                border-color 120ms ease-out;
        }

        .combat-btn:active,
        .combat-btn.active {
            transform: translateY(calc(var(--key-depth) - 1px));
            box-shadow: 0 1px 0 var(--stone-side);
            border-color: var(--stone-edge) var(--stone-glint) var(--stone-hi) var(--stone-cap);
            transition-duration: 45ms;
            transition-timing-function: ease-out;
        }

        .combat-btn-wide {
            grid-column: 1 / -1;
        }

        /* The letter is the game's own glyph; the text stays in the DOM for screen readers and tests */
        .combat-digit {
            display: block;
            width: 27px;
            height: 30px;
            color: transparent;
            font-size: 0;
            background: var(--glyph) center / 100% 100% no-repeat;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .glyph-a { --glyph: var(--glyph-a); --glyph-on: var(--glyph-a-red); }
        .glyph-b { --glyph: var(--glyph-b); --glyph-on: var(--glyph-b-red); }
        .glyph-d { --glyph: var(--glyph-d); --glyph-on: var(--glyph-d-red); }

        .combat-btn:active .combat-digit,
        .combat-btn.active .combat-digit {
            background-image: var(--glyph-on);
        }

        /* Small phones */
        @media (max-width: 360px) {
            :root {
                --pad-size: 146px;
                --key-edge: 5px;
                --key-depth: 6px;
                --cross-edge: 4px;
                --cross-depth: 5px;
            }
            .main-pad-row {
                max-width: 320px;
                gap: 10px;
            }
            .combat-grid {
                gap: 8px;
            }
            .combat-digit {
                width: 18px;
                height: 20px;
            }
        }

        /* Landscape */
        @media (orientation: landscape) {
            #app-container {
                max-width: 100%;
                max-height: 100%;
                flex-direction: row;
            }
            #screen-wrapper {
                height: 100%;
                width: auto;
                max-height: 100%;
                flex: 0 0 auto;
            }
            #screen-container {
                height: 100%;
                width: auto;
                aspect-ratio: 352 / 416;
                max-height: 100%;
                max-width: calc(100vh * (352 / 416));
            }
            .mobile-controls-panel {
                flex: 1;
                height: 100%;
                overflow-y: auto;
            }
        }

        /* Laptop / desktop: no on-screen pad. The native 352:416 game fits the window. */
        @media (hover: hover) and (pointer: fine) {
            #app-container {
                max-width: none;
                width: 100%;
                height: 100%;
                height: 100dvh;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            #screen-wrapper {
                width: 100%;
                height: 100%;
                max-height: none;
                flex: 1 1 auto;
            }

            #screen-container {
                height: min(96vh, 96dvh);
                width: auto;
                max-width: 96vw;
                aspect-ratio: 352 / 416;
                margin: auto;
            }

            .mobile-controls-panel {
                display: none;
            }
        }
    </style>
</head>

    <script>
        // === NUCLEAR ANTI-NEON GUARD ===
        // Kills any stale custom UI injected by a cached multiplayer_ui.js.
        // Runs immediately + watches via MutationObserver for any late-injected elements.
        (function() {
            var FORBIDDEN_IDS = [
                'mk-multiplayer-root','mp-view-lobby','mp-view-hero-select',
                'mp-view-versus','mp-view-victory','mp-combat-hud','mp-fullscreen-overlay'
            ];
            var FORBIDDEN_CLASSES = ['mp-view-','mk-multiplayer','mp-overlay','neon-'];

            function purgeNeonElements() {
                FORBIDDEN_IDS.forEach(function(id) {
                    var el = document.getElementById(id);
                    if (el) { console.warn('[GUARD] Removed stale neon element:', id); el.remove(); }
                });
                FORBIDDEN_CLASSES.forEach(function(cls) {
                    document.querySelectorAll('[class*="' + cls + '"]').forEach(function(el) {
                        console.warn('[GUARD] Removed stale neon class element:', el.className);
                        el.remove();
                    });
                });
            }

            // 1. Run immediately
            purgeNeonElements();

            // 2. Watch for any dynamic injections
            var observer = new MutationObserver(function(mutations) {
                for (var i = 0; i < mutations.length; i++) {
                    if (mutations[i].addedNodes.length > 0) {
                        purgeNeonElements();
                        break;
                    }
                }
            });
            observer.observe(document.documentElement, { childList: true, subtree: true });
        })();
    </script>
    <!-- BINARY RETRO SPLASH SCREEN (PURE BLACK & PUMPKIN ORANGE) -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="progress-bar-wrap">
                <div id="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <div id="app-container">
        <!-- 3:4 SCREEN CONTAINER (FIT BY WIDTH) -->
        <div id="screen-wrapper">
            <div id="screen-container">
                <canvas id="display" tabindex="0"></canvas>
                <!-- On-screen softkeys: touch targets over the game's own bottom-corner icons (OPTNS / BACK / PAUSE) -->
                <button id="screen-btn-lsk" class="ctrl-btn on-screen-softkey softkey-left" data-key="F1" aria-label="Left Soft Key / Options / Info">
                    <span class="softkey-press"></span>
                </button>
                <button id="screen-btn-rsk" class="ctrl-btn on-screen-softkey softkey-right" data-key="F2" aria-label="Right Soft Key / Back / Pause">
                    <span class="softkey-press"></span>
                </button>
            </div>
        </div>

        <!-- LOWER CONTROLS (same black as the game, no divider) -->
        <div class="mobile-controls-panel">
            <!-- MAIN COMBAT CONTROLS: 8-WAY D-PAD (LEFT) + A/B/C/D RETRO KEYPAD (RIGHT) -->
            <div class="main-pad-row">
                <!-- Left: 8-Directional Tactile D-Pad (Touch & Smooth Glide Pad) -->
                <div class="dpad-8-grid" id="dpad-grid" aria-label="8-Directional Movement Pad">
                    <!-- Stone cross: edge cells are the arms, corners are the invisible diagonals -->
                    <div class="dpad-cross">
                        <button class="dpad-corner btn-mk" data-dir="up-left" aria-label="Jump Up-Left"></button>
                        <button class="dpad-arm btn-mk" data-dir="up" aria-label="Jump Up"><span class="dpad-tri"></span></button>
                        <button class="dpad-corner btn-mk" data-dir="up-right" aria-label="Jump Up-Right"></button>

                        <button class="dpad-arm btn-mk" data-dir="left" aria-label="Move Left"><span class="dpad-tri"></span></button>
                        <div class="dpad-hub" data-dir="center" aria-label="Neutral Center">
                            <div class="dpad-stud"></div>
                        </div>
                        <button class="dpad-arm btn-mk" data-dir="right" aria-label="Move Right"><span class="dpad-tri"></span></button>

                        <button class="dpad-corner btn-mk" data-dir="down-left" aria-label="Crouch Down"></button>
                        <button class="dpad-arm btn-mk" data-dir="down" aria-label="Crouch Down"><span class="dpad-tri"></span></button>
                        <button class="dpad-corner btn-mk" data-dir="down-right" aria-label="Crouch Down"></button>
                    </div>
                </div>

                <!-- Right: Combat Action Keypad. A (Punch / Select) is the wide thumb button. -->
                <div class="combat-grid" id="combat-grid" aria-label="Combat Attack Keypad">

                        <span class="combat-digit glyph-b">B</span>

                        <span class="combat-digit glyph-d">D</span>

                    <button class="ctrl-btn btn-mk combat-btn combat-btn-wide" data-key="Digit5,Numpad5,KeyJ,Space,Enter" aria-label="Button A (Punch / Select)">

    <!-- 100% Pure Native JavaScript Engine Entrypoint -->
    <script type="module">
        window.addEventListener('error', (e) => console.error("Global Error:", e.message, e.filename, e.lineno, e.error));
        window.addEventListener('unhandledrejection', (e) => console.error("Unhandled Rejection:", e.reason));

        // Telegram Mini App Auto-Ready & Expanded Mode (middle mode)
        function initTelegramWebApp() {
            if (!window.Telegram?.WebApp) return;
            try {
                const tg = window.Telegram.WebApp;
                tg.ready();

                // 1. Expand to maximum height while preserving standard Telegram navigation header
                tg.expand();

                // 2. Disable vertical swipes to prevent pull-to-close dismiss during game taps
                if (typeof tg.disableVerticalSwipes === 'function') {
                    try { tg.disableVerticalSwipes(); } catch (_) {}
                }

                // 3. Lock orientation to portrait if supported
                if (typeof tg.lockOrientation === 'function') {
                    try { tg.lockOrientation('portrait'); } catch (_) {}
                }

                // 4. Immersive theme colors
                try {
                    if (tg.setHeaderColor) tg.setHeaderColor("#000000");
                    if (tg.setBackgroundColor) tg.setBackgroundColor("#000000");
                    if (tg.setBottomBarColor) tg.setBottomBarColor("#000000");
                } catch (_) {}

                // 5. Viewport change safety handler: keep expanded
                tg.onEvent?.('viewportChanged', () => {
                    if (!tg.isExpanded) {
                        try { tg.expand(); } catch (_) {}
                    }
                });

                console.log("Telegram Mini App SDK loaded in Expanded Mode (top navigation header preserved)!");
            } catch (tgErr) {
                console.warn("Telegram WebApp init warning:", tgErr);
            }
        }

        initTelegramWebApp();

        // Safety handler: Ensure expanded on first user gesture without forcing full-screen takeover
        const ensureExpandedOnGesture = () => {
            if (window.Telegram?.WebApp) {
                const tg = window.Telegram.WebApp;
                if (!tg.isExpanded) {
                    try { tg.expand(); } catch (_) {}
                }
            }
        };
        window.addEventListener('pointerdown', ensureExpandedOnGesture, { passive: true });
        window.addEventListener('touchstart', ensureExpandedOnGesture, { passive: true });
        window.addEventListener('click', ensureExpandedOnGesture, { passive: true });

        // Load Immortal Combat pure JS engine
        const APP_BUILD_HASH = "v20261031_pure_native_v3";
        import(`./js/game_pure.js?v=${APP_BUILD_HASH}`).catch(err => {
            console.error("Engine Start Error:", err);
            window.__lastErr = err.message + '\n' + err.stack;
        });
    </script>
