<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0e14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:,">
    <title>Immortal Combat - Mobile Player</title>
    <!-- Telegram Mini App WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --side-btn-width: 74px;
            --main-pad-height: 160px;
            --controls-panel-height: 215px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            color: #e0e2ec;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: #000000;
            position: relative;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* --- SCREEN CONTAINER: PRESERVES 3:4 RATIO & FITS BY WIDTH --- */
        #screen-wrapper {
            width: 100%;
            flex: 0 0 auto;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: none;
            overflow: hidden;
        }

        #screen-container {
            width: 100%;
            aspect-ratio: 3 / 4;
            max-height: calc(100dvh - var(--controls-panel-height, 250px));
            max-width: calc((100dvh - var(--controls-panel-height, 250px)) * 0.75);
            margin: 0 auto;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #display {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: fill;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-color: #000;
        }

        #display:focus {
            outline: none;
        }

        /* --- BINARY RETRO SPLASH SCREEN (PURE BLACK & PUMPKIN ORANGE) --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000000;
            z-index: 99999;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .progress-bar-wrap {
            width: 320px;
            max-width: 85vw;
            height: 18px;
            background: #000000;
            border: 3px solid #ff7518;
            border-radius: 0;
            margin: 0;
            overflow: hidden;
            box-sizing: border-box;
        }

        #progress-bar-fill {
            width: 0%;
            height: 100%;
            background: #ff7518;
            border-radius: 0;
            transition: width 0.1s linear;
        }

        /* --- IMMORTAL COMBAT RETRO CONTROLS PANEL (PITCH BLACK BACKGROUND) --- */
        .mobile-controls-panel {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
            background: #000000;
            border-top: none;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* --- IMMORTAL COMBAT STONE/BRONZE 3D BEVELED BUTTON DESIGN CODE --- */
        .btn-mk {
            position: relative;
            outline: none;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #2c251b 0%, #1c1711 52%, #110e0a 100%);
            color: #e5c687;
            border-top: 1.5px solid rgba(220, 185, 110, 0.45);
            border-left: 1px solid rgba(180, 145, 80, 0.25);
            border-right: 1.5px solid rgba(0, 0, 0, 0.65);
            border-bottom: 2.5px solid rgba(0, 0, 0, 0.85);
            box-shadow: 
                0 3px 0 #050403,
                0 5px 10px rgba(0, 0, 0, 0.85),
                inset 0 1px 0 rgba(240, 210, 140, 0.22);
            transition: transform 0.04s ease-out, box-shadow 0.04s ease-out, background 0.04s ease-out, color 0.04s ease-out;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        /* Active / Pressed state - Burning Amber / Golden Glow */
        .btn-mk:active, .btn-mk.active {
            transform: translateY(2px);
            box-shadow: 
                0 1px 0 #050403,
                0 2px 4px rgba(0, 0, 0, 0.9),
                inset 0 2px 5px rgba(0, 0, 0, 0.8),
                0 0 14px rgba(229, 198, 135, 0.75);
            background: linear-gradient(180deg, #3a2e1d 0%, #241c10 100%);
            color: #fff2b8;
            text-shadow: 0 0 10px rgba(255, 230, 140, 0.95), 0 0 18px rgba(212, 175, 55, 0.7);
        }

        /* --- ON-SCREEN INTERACTIVE SOFTKEY ICONS (LSK / RSK) --- */
        .on-screen-softkey {
            position: absolute;
            bottom: 0px;
            width: 64px;
            height: 56px;
            z-index: 20;
            cursor: pointer;
            background: transparent;
            border: none;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            padding: 0;
        }

        .softkey-left {
            left: 0px;
        }

        .softkey-right {
            right: 0px;
        }

        /* Glowing touch ripple/halo matching MK Golden/Bronze button design code */
        .softkey-pulse {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(229, 198, 135, 0);
            background: radial-gradient(circle, rgba(229, 198, 135, 0.45) 0%, rgba(180, 140, 60, 0.15) 65%, transparent 100%);
            opacity: 0;
            transform: scale(0.75);
            transition: opacity 0.08s ease, transform 0.08s ease, border-color 0.08s ease;
            pointer-events: none;
        }

        .on-screen-softkey:active .softkey-pulse,
        .on-screen-softkey.active .softkey-pulse {
            opacity: 1;
            transform: scale(1.18);
            border-color: rgba(229, 198, 135, 0.9);
            box-shadow: 0 0 16px rgba(229, 198, 135, 0.85);
        }

        /* --- MAIN COMBAT PAD ROW: LEFT 8-WAY D-PAD + RIGHT 2x2 COMBAT KEYPAD --- */
        .main-pad-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* --- 1. LEFT SIDE: 8-DIRECTIONAL TACTILE D-PAD (TOUCH & GLIDE PAD) --- */
        .dpad-8-grid {
            width: var(--main-pad-height, 160px);
            height: var(--main-pad-height, 160px);
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            background: #080706;
            padding: 6px;
            border-radius: 20px;
            border: 2px solid #3d3120;
            box-shadow: 
                0 6px 18px rgba(0, 0, 0, 0.95),
                inset 0 2px 6px rgba(0, 0, 0, 0.85);
            touch-action: none;
            flex-shrink: 0;
            box-sizing: border-box;
            position: relative;
        }

        .dpad-btn {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            padding: 0;
            line-height: 1;
        }

        .dpad-card {
            font-size: 1.25em;
            font-weight: 900;
        }

        .dpad-diag {
            font-size: 1.05em;
            font-weight: 800;
            opacity: 0.88;
        }

        .dpad-center-hub {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #1a150e 0%, #0d0a07 100%);
            border-radius: 50%;
            border: 1px solid rgba(180, 145, 80, 0.25);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.85);
            pointer-events: auto;
            cursor: pointer;
        }

        .dpad-center-dimple {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #3a2e1d 0%, #15110b 100%);
            border: 1px solid rgba(220, 185, 110, 0.35);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
        }

        /* --- 2. RIGHT SIDE: COMBAT KEYPAD (BUTTONS A, B, D) --- */
        .combat-4-grid,
        .combat-grid {
            width: var(--main-pad-height, 160px);
            height: var(--main-pad-height, 160px);
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px;
            background: #080706;
            padding: 7px;
            border-radius: 20px;
            border: 2px solid #3d3120;
            box-shadow: 
                0 6px 18px rgba(0, 0, 0, 0.95),
                inset 0 2px 6px rgba(0, 0, 0, 0.85);
            touch-action: none;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .combat-btn {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .combat-btn-wide {
            grid-column: 1 / -1;
        }

        .combat-digit {
            font-size: 1.8em;
            font-weight: 900;
            line-height: 1;
            color: #e5c687;
            user-select: none;
            -webkit-user-select: none;
            display: block;
        }

        .combat-btn:active .combat-digit,
        .combat-btn.active .combat-digit {
            color: #fff2b8;
            text-shadow: 0 0 12px rgba(255, 230, 140, 0.95), 0 0 20px rgba(212, 175, 55, 0.7);
        }

        /* Small screens */
        @media (max-width: 360px) {
            :root {
                --side-btn-width: 62px;
                --main-pad-height: 144px;
                --controls-panel-height: 195px;
            }
            .main-pad-row {
                max-width: 320px;
                gap: 10px;
            }
            .dpad-8-grid {
                width: 144px;
                height: 144px;
                gap: 3px;
                padding: 5px;
                border-radius: 16px;
            }
            .dpad-card {
                font-size: 1.1em;
            }
            .dpad-diag {
                font-size: 0.95em;
            }
            .combat-4-grid,
            .combat-grid {
                width: 144px;
                height: 144px;
                gap: 6px;
                padding: 6px;
                border-radius: 16px;
            }
            .combat-digit {
                font-size: 1.5em;
            }
        }
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.85);
        }

        /* Small screens */
        @media (max-width: 360px) {
            :root {
                --side-btn-width: 62px;
                --main-pad-height: 144px;
                --controls-panel-height: 195px;
            }
            .main-pad-row {
                max-width: 320px;
                gap: 10px;
            }
            .joystick-zone {
                width: 144px;
                height: 144px;
            }
            .joystick-thumb {
                width: 48px;
                height: 48px;
            }
            .thumb-dimple {
                width: 18px;
                height: 18px;
            }
            .combat-4-grid,
            .combat-grid {
                width: 144px;
                height: 144px;
                gap: 7px;
                padding: 6px;
                border-radius: 16px;
            }
            .combat-digit {
                font-size: 1.45em;
            }
        }

        /* Landscape adjustments if rotated */
        @media (orientation: landscape) {
            #app-container {
                max-width: 100%;
                max-height: 100%;
                flex-direction: row;
                border-radius: 0;
            }
            #screen-wrapper {
                height: 100%;
                width: auto;
                max-height: 100%;
                flex: 0 0 auto;
                border-bottom: none;
                border-right: none;
            }
            #screen-container {
                height: 100%;
                width: auto;
                aspect-ratio: 3 / 4;
                max-height: 100%;
                max-width: calc(100vh * 0.75);
            }
            .mobile-controls-panel {
                flex: 1;
                height: 100%;
                overflow-y: auto;
            }
        }

        /* Laptop / MacBook / desktop: no on-screen pad. The 3:4 game fits the window. */
        @media (hover: hover) and (pointer: fine) {
            :root {
                --controls-panel-height: 0px;
            }

            #app-container {
                max-width: none;
                width: 100%;
                height: 100%;
                height: 100dvh;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                box-shadow: none;
                background: #000000;
            }

            #screen-wrapper {
                width: 100%;
                height: 100%;
                max-height: none;
                flex: 1 1 auto;
                border: none;
            }

            #screen-container {
                width: min(100vw, calc(100vh * 0.75));
                width: min(100vw, calc(100dvh * 0.75));
                height: min(100vh, calc(100vw * 4 / 3));
                height: min(100dvh, calc(100vw * 4 / 3));
                max-width: 100vw;
                max-height: 100vh;
                max-height: 100dvh;
                aspect-ratio: 3 / 4;
                margin: 0;
            }

            .mobile-controls-panel {
                display: none;
            }
        }

        #keyboard-hint {
            display: none;
            position: fixed;
            left: 50%;
            bottom: max(22px, env(safe-area-inset-bottom, 0px));
            z-index: 40;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: max-content;
            max-width: calc(100vw - 28px);
            padding: 16px 18px 14px;
            background: rgba(8, 7, 6, 0.92);
            border: 1px solid rgba(229, 198, 135, 0.28);
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
            pointer-events: none;
            color: #f4efe4;
            transform: translateX(-50%);
            opacity: 0;
        }

        .kh-title {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #e5c687;
        }

        .kh-keys {
            display: grid;
            grid-template-columns: repeat(3, 58px);
            gap: 6px;
        }

        .kh-zero {
            grid-column: 2;
        }

        .kh-extra {
            display: flex;
            gap: 8px;
        }

        #keyboard-hint kbd {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-height: 48px;
            border-radius: 10px;
            background: linear-gradient(180deg, #3a3226 0%, #1a1612 70%);
            color: #f7f1e4;
            border: 1px solid rgba(229, 198, 135, 0.18);
            border-top-color: rgba(255, 236, 196, 0.35);
            box-shadow: 0 2px 0 #050403, 0 6px 12px rgba(0, 0, 0, 0.35);
            font-family: inherit;
            font-size: 16px;
            font-weight: 800;
            line-height: 1;
        }

        #keyboard-hint kbd small {
            font-size: 9px;
            font-weight: 750;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #e5c687;
        }

        #keyboard-hint kbd.kh-wide {
            min-width: 92px;
            padding: 0 12px;
        }

        @media (hover: hover) and (pointer: fine) {
            #keyboard-hint {
                display: flex;
                animation: kh-in 0.45s ease 0.2s forwards;
            }

            #keyboard-hint.is-hiding {
                animation: none;
                opacity: 0;
                transition: opacity 0.4s ease;
            }
        }

        @keyframes kh-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- BINARY RETRO SPLASH SCREEN (PURE BLACK & PUMPKIN ORANGE) -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="progress-bar-wrap">
                <div id="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <div id="app-container">
        <!-- 3:4 SCREEN CONTAINER (FIT BY WIDTH) -->
        <div id="screen-wrapper">
            <div id="screen-container">
                <canvas id="display" tabindex="0"></canvas>
                <!-- On-Screen Softkeys: Interactive Touch Targets Directly Over in-Game Left & Right Icons -->
                <button id="screen-btn-lsk" class="ctrl-btn on-screen-softkey softkey-left" data-key="F1" aria-label="Left Soft Key / Options / Info">
                    <span class="softkey-pulse"></span>
                </button>
                <button id="screen-btn-rsk" class="ctrl-btn on-screen-softkey softkey-right" data-key="F2" aria-label="Right Soft Key / Back / Pause">
                    <span class="softkey-pulse"></span>
                </button>
            </div>
        </div>

        <!-- LOWER CONTROLS PANEL (IMMORTAL COMBAT PITCH BLACK ARCHITECTURE) -->
        <div class="mobile-controls-panel">
            <!-- MAIN COMBAT CONTROLS: 8-WAY D-PAD (LEFT) + A/B/C/D RETRO KEYPAD (RIGHT) -->
            <div class="main-pad-row">
                <!-- Left: 8-Directional Tactile D-Pad (Touch & Smooth Glide Pad) -->
                <div class="dpad-8-grid" id="dpad-grid" aria-label="8-Directional Movement Pad">
                    <!-- Row 1: Up-Left, Up, Up-Right -->
                    <button class="dpad-btn btn-mk dpad-diag" data-dir="up-left" aria-label="Jump Up-Left">↖</button>
                    <button class="dpad-btn btn-mk dpad-card" data-dir="up" aria-label="Jump Up">▲</button>
                    <button class="dpad-btn btn-mk dpad-diag" data-dir="up-right" aria-label="Jump Up-Right">↗</button>

                    <!-- Row 2: Left, Center Neutral Core, Right -->
                    <button class="dpad-btn btn-mk dpad-card" data-dir="left" aria-label="Move Left">◄</button>
                    <div class="dpad-center-hub" data-dir="center" aria-label="Neutral Center">
                        <div class="dpad-center-dimple"></div>
                    </div>
                    <button class="dpad-btn btn-mk dpad-card" data-dir="right" aria-label="Move Right">►</button>

                    <!-- Row 3: Down-Left, Down, Down-Right -->
                    <button class="dpad-btn btn-mk dpad-diag" data-dir="down-left" aria-label="Crouch Down">↙</button>
                    <button class="dpad-btn btn-mk dpad-card" data-dir="down" aria-label="Crouch Down">▼</button>
                    <button class="dpad-btn btn-mk dpad-diag" data-dir="down-right" aria-label="Crouch Down">↘</button>
                </div>

                <!-- Right: Combat Action Keypad. A (Punch / Select) is the wide thumb button. -->
                <div class="combat-grid" id="combat-grid" aria-label="Combat Attack Keypad">
                    <button class="ctrl-btn btn-mk combat-btn" data-key="Digit7,Numpad7,KeyK" aria-label="Button B (Kick)">
                        <span class="combat-digit">B</span>
                    </button>
                    <button class="ctrl-btn btn-mk combat-btn" data-key="Digit9,Numpad9,KeyL,KeyU,KeyO" aria-label="Button D (Block / Special)">
                        <span class="combat-digit">D</span>
                    </button>
                    <button class="ctrl-btn btn-mk combat-btn combat-btn-wide" data-key="Digit5,Numpad5,KeyJ,Space,Enter" aria-label="Button A (Punch / Select)">
                        <span class="combat-digit">A</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Desktop keypad card. Shown once at the start, then hidden. Touch screens keep the on-screen pad. -->
    <aside id="keyboard-hint" aria-label="Keyboard controls">
        <p class="kh-title">Keys</p>
        <div class="kh-keys">
            <kbd>1</kbd>
            <kbd>2<small>Up</small></kbd>
            <kbd>3</kbd>
            <kbd>4<small>Left</small></kbd>
            <kbd>5<small>Punch</small></kbd>
            <kbd>6<small>Right</small></kbd>
            <kbd>7<small>Kick</small></kbd>
            <kbd>8<small>Down</small></kbd>
            <kbd>9<small>Block</small></kbd>
            <kbd class="kh-zero">0</kbd>
        </div>
        <div class="kh-extra">
            <kbd class="kh-wide">Enter<small>OK</small></kbd>
            <kbd class="kh-wide">Shift<small>Kick</small></kbd>
        </div>
    </aside>
    <script>
        (function () {
            var hint = document.getElementById('keyboard-hint');
            if (!hint || !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

            var gone = false;
            function hide() {
                if (gone) return;
                gone = true;
                hint.classList.add('is-hiding');
                hint.setAttribute('aria-hidden', 'true');
                setTimeout(function () { hint.hidden = true; }, 420);
            }

            function arm() {
                window.addEventListener('keydown', hide, { once: true });
                setTimeout(hide, 6000);
            }

            var splash = document.getElementById('splash-screen');
            if (!splash) {
                arm();
                return;
            }

            var armed = false;
            function maybeArm() {
                if (armed) return;
                if (splash.classList.contains('fade-out') || !splash.isConnected) {
                    armed = true;
                    arm();
                }
            }

            var obs = new MutationObserver(maybeArm);
            obs.observe(splash, { attributes: true, attributeFilter: ['class'] });
            if (splash.parentNode) obs.observe(splash.parentNode, { childList: true });
        })();
    </script>

    <!-- 100% Pure Native JavaScript Engine Entrypoint -->
    <script type="module">
        window.addEventListener('error', (e) => console.error("Global Error:", e.message, e.filename, e.lineno, e.error));
        window.addEventListener('unhandledrejection', (e) => console.error("Unhandled Rejection:", e.reason));

        // Telegram Mini App Auto-Ready & Expanded Mode (middle mode)
        function initTelegramWebApp() {
            if (!window.Telegram?.WebApp) return;
            try {
                const tg = window.Telegram.WebApp;
                tg.ready();

                // 1. Expand to maximum height while preserving standard Telegram navigation header
                tg.expand();

                // 2. Disable vertical swipes to prevent pull-to-close dismiss during game taps
                if (typeof tg.disableVerticalSwipes === 'function') {
