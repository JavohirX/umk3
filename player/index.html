<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0e14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:,">
    <title>Ultimate Mortal Kombat 3 - Mobile Player</title>
    <!-- Telegram Mini App WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --side-btn-width: 74px;
            --main-pad-height: 160px;
            --controls-panel-height: 215px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #08090d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            color: #e0e2ec;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: #0d0e15;
            position: relative;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* --- SCREEN CONTAINER: PRESERVES 3:4 RATIO & FITS BY WIDTH --- */
        #screen-wrapper {
            width: 100%;
            flex: 0 0 auto;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 2px solid #232635;
            overflow: hidden;
        }

        #screen-container {
            width: 100%;
            aspect-ratio: 3 / 4;
            max-height: calc(100dvh - var(--controls-panel-height, 250px));
            max-width: calc((100dvh - var(--controls-panel-height, 250px)) * 0.75);
            margin: 0 auto;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #display {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: fill;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-color: #000;
        }

        #display:focus {
            outline: none;
        }

        /* --- BINARY RETRO SPLASH SCREEN (PURE BLACK & PUMPKIN ORANGE) --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000000;
            z-index: 99999;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .progress-bar-wrap {
            width: 320px;
            max-width: 85vw;
            height: 18px;
            background: #000000;
            border: 3px solid #ff7518;
            border-radius: 0;
            margin: 0;
            overflow: hidden;
            box-sizing: border-box;
        }

        #progress-bar-fill {
            width: 0%;
            height: 100%;
            background: #ff7518;
            border-radius: 0;
            transition: width 0.1s linear;
        }

        /* --- 3D TACTILE RETRO CONTROLS PANEL --- */
        .mobile-controls-panel {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
            background: radial-gradient(circle at 50% 15%, #181b29 0%, #0a0b12 100%);
            border-top: 1px solid #292d3f;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Base 3D Tactile Button */
        .btn-3d {
            position: relative;
            border: none;
            outline: none;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: transform 0.04s ease-out, box-shadow 0.04s ease-out, background 0.04s ease-out, color 0.04s ease-out;
            -webkit-tap-highlight-color: transparent;
        }

        /* Dark Slate 3D Keycap */
        .btn-3d-dark {
            background: linear-gradient(180deg, #373c52 0%, #242838 52%, #191c28 100%);
            color: #e2e8f0;
            border-radius: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(0, 0, 0, 0.4);
            box-shadow: 
                0 4px 0 #090a10,
                0 6px 10px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        /* 3D Button Mechanically Pressed Animation - Telegram UI Blue */
        .btn-3d-dark:active, .btn-3d-dark.active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 #090a10,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 5px rgba(0, 0, 0, 0.6),
                0 0 12px rgba(41, 148, 236, 0.55);
            background: linear-gradient(180deg, #1b283d 0%, #121c2c 100%);
            color: #2994ec;
        }

        /* --- ON-SCREEN INTERACTIVE SOFTKEY ICONS (LSK / RSK) --- */
        .on-screen-softkey {
            position: absolute;
            bottom: 0px;
            width: 64px;
            height: 56px;
            z-index: 20;
            cursor: pointer;
            background: transparent;
            border: none;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            padding: 0;
        }

        .softkey-left {
            left: 0px;
        }

        .softkey-right {
            right: 0px;
        }

        /* Glowing touch ripple/halo centered over the in-game icon */
        .softkey-pulse {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(56, 189, 248, 0);
            background: radial-gradient(circle, rgba(56, 189, 248, 0.45) 0%, rgba(41, 148, 236, 0.15) 65%, transparent 100%);
            opacity: 0;
            transform: scale(0.75);
            transition: opacity 0.08s ease, transform 0.08s ease, border-color 0.08s ease;
            pointer-events: none;
        }

        .on-screen-softkey:active .softkey-pulse,
        .on-screen-softkey.active .softkey-pulse {
            opacity: 1;
            transform: scale(1.18);
            border-color: rgba(56, 189, 248, 0.85);
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.8);
        }

        /* --- MAIN COMBAT PAD ROW: LEFT JOYSTICK + RIGHT 2x2 COMBAT KEYPAD --- */
        .main-pad-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* --- 1. LEFT SIDE: VIRTUAL 360° JOYSTICK (FREE ROTATION & 8-WAY FEEDBACK) --- */
        .joystick-zone {
            width: var(--main-pad-height, 154px);
            height: var(--main-pad-height, 154px);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, #141724 0%, #0d0e17 100%);
            border: 2px solid #24283c;
            box-shadow: 
                0 6px 18px rgba(0, 0, 0, 0.75),
                inset 0 3px 8px rgba(0, 0, 0, 0.85);
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
        }

        /* Subtle inner alignment ring */
        .joy-base-ring {
            position: absolute;
            width: 58%;
            height: 58%;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        /* 8 Directional Indicators positioned radially */
        .joy-dir-indicator {
            position: absolute;
            font-weight: 800;
            pointer-events: none;
            transition: color 0.08s ease, text-shadow 0.08s ease, transform 0.08s ease;
            user-select: none;
            -webkit-user-select: none;
            line-height: 1;
            text-align: center;
        }

        /* Cardinal arrows */
        .joy-up, .joy-down, .joy-left, .joy-right {
            font-size: 1.15em;
            color: #64748b;
        }

        .joy-up {
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
        }

        .joy-down {
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
        }

        .joy-left {
            left: 6px;
            top: 50%;
            transform: translateY(-50%);
        }

        .joy-right {
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Diagonal arrows */
        .joy-up-left, .joy-up-right, .joy-down-left, .joy-down-right {
            font-size: 0.95em;
            color: #475569;
        }

        .joy-up-left {
            top: 14px;
            left: 14px;
        }

        .joy-up-right {
            top: 14px;
            right: 14px;
        }

        .joy-down-left {
            bottom: 14px;
            left: 14px;
        }

        .joy-down-right {
            bottom: 14px;
            right: 14px;
        }

        /* Active glowing direction state (Telegram cyan blue glow) */
        .joy-dir-indicator.active {
            color: #38bdf8 !important;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.95), 0 0 18px rgba(41, 148, 236, 0.7);
        }

        .joy-up.active {
            transform: translateX(-50%) scale(1.25);
        }

        .joy-down.active {
            transform: translateX(-50%) scale(1.25);
        }

        .joy-left.active {
            transform: translateY(-50%) scale(1.25);
        }

        .joy-right.active {
            transform: translateY(-50%) scale(1.25);
        }

        .joy-up-left.active, .joy-up-right.active, .joy-down-left.active, .joy-down-right.active {
            transform: scale(1.25);
        }

        /* 3D Tactile Thumb Knob */
        .joystick-thumb {
            position: absolute;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #474e6b 0%, #292d3f 55%, #181b28 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.28);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            border-right: 1px solid rgba(0, 0, 0, 0.4);
            border-bottom: 2px solid rgba(0, 0, 0, 0.7);
            box-shadow: 
                0 4px 0 #090a10,
                0 8px 14px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            will-change: transform;
            transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
        }

        .joystick-zone.dragging .joystick-thumb {
            transition: none;
            box-shadow: 
                0 2px 0 #090a10,
                0 4px 8px rgba(0, 0, 0, 0.8),
                inset 0 1px 3px rgba(0, 0, 0, 0.6),
                0 0 14px rgba(41, 148, 236, 0.65);
            border-color: rgba(56, 189, 248, 0.6);
        }

        .thumb-dimple {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle at 45% 40%, #1e2230 0%, #11131b 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.85);
        }

        /* --- 2. RIGHT SIDE: 2x2 COMBAT KEYPAD (KEYS 5, 7, 8, 9 - NUMBERS ONLY) --- */
        .combat-4-grid {
            width: var(--main-pad-height, 160px);
            height: var(--main-pad-height, 160px);
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            background: #11131e;
            padding: 8px;
            border-radius: 20px;
            border: 2px solid #24283c;
            box-shadow: 
                0 6px 18px rgba(0, 0, 0, 0.75),
                inset 0 2px 6px rgba(0, 0, 0, 0.7);
            touch-action: none;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .combat-btn {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .combat-digit {
            font-size: 1.75em;
            font-weight: 850;
            line-height: 1;
            color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
            display: block;
        }

        .combat-btn:active .combat-digit,
        .combat-btn.active .combat-digit {
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.85);
        }

        /* Small screens */
        @media (max-width: 360px) {
            :root {
                --side-btn-width: 62px;
                --main-pad-height: 144px;
                --controls-panel-height: 195px;
            }
            .main-pad-row {
                max-width: 320px;
                gap: 10px;
            }
            .joystick-zone {
                width: 144px;
                height: 144px;
            }
            .joystick-thumb {
                width: 48px;
                height: 48px;
            }
            .thumb-dimple {
                width: 18px;
                height: 18px;
            }
            .combat-4-grid {
                width: 144px;
                height: 144px;
                gap: 7px;
                padding: 6px;
                border-radius: 16px;
            }
            .combat-digit {
                font-size: 1.45em;
            }
        }

        /* Landscape adjustments if rotated */
        @media (orientation: landscape) {
            #app-container {
                max-width: 100%;
                max-height: 100%;
                flex-direction: row;
                border-radius: 0;
            }
            #screen-wrapper {
                height: 100%;
                width: auto;
                max-height: 100%;
                flex: 0 0 auto;
                border-bottom: none;
                border-right: 2px solid #232635;
            }
            #screen-container {
                height: 100%;
                width: auto;
                aspect-ratio: 3 / 4;
                max-height: 100%;
                max-width: calc(100vh * 0.75);
            }
            .mobile-controls-panel {
                flex: 1;
                height: 100%;
                overflow-y: auto;
            }
        }

        /* Laptop / MacBook / desktop: no on-screen pad. The 3:4 game fits the window. */
        @media (hover: hover) and (pointer: fine) {
            :root {
                --controls-panel-height: 0px;
            }

            #app-container {
                max-width: none;
                width: 100%;
                height: 100%;
                height: 100dvh;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                box-shadow: none;
                background: #08090d;
            }

            #screen-wrapper {
                width: 100%;
                height: 100%;
                max-height: none;
                flex: 1 1 auto;
                border: none;
            }

            #screen-container {
                width: min(100vw, calc(100vh * 0.75));
                width: min(100vw, calc(100dvh * 0.75));
                height: min(100vh, calc(100vw * 4 / 3));
                height: min(100dvh, calc(100vw * 4 / 3));
                max-width: 100vw;
                max-height: 100vh;
                max-height: 100dvh;
                aspect-ratio: 3 / 4;
                margin: 0;
            }

            .mobile-controls-panel {
                display: none;
            }
        }

        #keyboard-hint {
            display: none;
            position: fixed;
            right: max(16px, env(safe-area-inset-right, 0px));
            bottom: max(16px, env(safe-area-inset-bottom, 0px));
            z-index: 30;
            flex-direction: column;
            gap: 10px;
            width: max-content;
            max-width: calc(100vw - 32px);
            padding: 12px 14px 13px;
            background: rgba(8, 9, 13, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
            pointer-events: none;
            color: #9aa3b8;
            font-size: 11px;
            font-weight: 650;
            line-height: 1;
        }

        .kh-title {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #7f879b;
        }

        .kh-pads {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .kh-pad {
            display: grid;
            grid-template-columns: repeat(3, 26px);
            grid-template-rows: repeat(2, 24px);
            gap: 4px;
        }

        .kh-or {
            color: #6d758a;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        #keyboard-hint kbd {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 26px;
            height: 24px;
            padding: 0 6px;
            border-radius: 5px;
            background: linear-gradient(180deg, #3c4258 0%, #262a3b 55%, #1a1e2c 100%);
            color: #f4f7fb;
            border-top: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 2px 0 #090a10, 0 3px 6px rgba(0, 0, 0, 0.35);
            font-family: inherit;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        #keyboard-hint kbd.wide {
            min-width: 64px;
        }

        .kh-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .kh-list li {
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 24px;
        }

        @media (hover: hover) and (pointer: fine) {
            #keyboard-hint {
                display: flex;
            }
        }

        @media (hover: hover) and (pointer: fine) and (max-height: 680px) {
            #keyboard-hint {
                transform: scale(0.86);
                transform-origin: bottom right;
            }
        }
    </style>
</head>
<body>
    <!-- BINARY RETRO SPLASH SCREEN (PURE BLACK & PUMPKIN ORANGE) -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="progress-bar-wrap">
                <div id="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <div id="app-container">
        <!-- 3:4 SCREEN CONTAINER (FIT BY WIDTH) -->
        <div id="screen-wrapper">
            <div id="screen-container">
                <canvas id="display" tabindex="0"></canvas>
                <!-- On-Screen Softkeys: Interactive Touch Targets Directly Over in-Game Left & Right Icons -->
                <button id="screen-btn-lsk" class="ctrl-btn on-screen-softkey softkey-left" data-key="F1" aria-label="Left Soft Key / Options / Info">
                    <span class="softkey-pulse"></span>
                </button>
                <button id="screen-btn-rsk" class="ctrl-btn on-screen-softkey softkey-right" data-key="F2" aria-label="Right Soft Key / Back / Pause">
                    <span class="softkey-pulse"></span>
                </button>
            </div>
        </div>

        <!-- LOWER CONTROLS PANEL (CLEAN DEDICATED CONSOLE CONTROLLER) -->
        <div class="mobile-controls-panel">
            <!-- MAIN COMBAT CONTROLS: 360° JOYSTICK (LEFT) + 4-KEY RETRO KEYPAD (RIGHT) -->
            <div class="main-pad-row">
                <!-- Left: 360° Virtual Joystick with 8-Way Directional Feedback -->
                <div class="joystick-zone" id="joystick-zone" aria-label="360 Directional Joystick">
                    <div class="joy-dir-indicator joy-up" data-joy-dir="up" aria-hidden="true">▲</div>
                    <div class="joy-dir-indicator joy-down" data-joy-dir="down" aria-hidden="true">▼</div>
                    <div class="joy-dir-indicator joy-left" data-joy-dir="left" aria-hidden="true">◄</div>
                    <div class="joy-dir-indicator joy-right" data-joy-dir="right" aria-hidden="true">►</div>
                    <div class="joy-dir-indicator joy-up-left" data-joy-dir="up-left" aria-hidden="true">↖</div>
                    <div class="joy-dir-indicator joy-up-right" data-joy-dir="up-right" aria-hidden="true">↗</div>
                    <div class="joy-dir-indicator joy-down-left" data-joy-dir="down-left" aria-hidden="true">↙</div>
                    <div class="joy-dir-indicator joy-down-right" data-joy-dir="down-right" aria-hidden="true">↘</div>

                    <div class="joy-base-ring" aria-hidden="true"></div>

                    <div class="joystick-thumb btn-3d btn-3d-dark" id="joystick-thumb" aria-hidden="true">
                        <div class="thumb-dimple"></div>
                    </div>
                </div>

                <!-- Right: 2x2 Combat Action Keypad (5, 7, 8, 9 - Numbers Only) -->
                <div class="combat-4-grid" id="combat-grid" aria-label="Combat Attack Keypad">
                    <!-- Row 1: 5 (Punch / Select) and 7 (Kick) -->
                    <button class="ctrl-btn btn-3d btn-3d-dark combat-btn" data-key="Digit5,Numpad5" aria-label="Key 5">
                        <span class="combat-digit">5</span>
                    </button>
                    <button class="ctrl-btn btn-3d btn-3d-dark combat-btn" data-key="Digit7,Numpad7" aria-label="Key 7">
                        <span class="combat-digit">7</span>
                    </button>

                    <!-- Row 2: 8 (Duck / Crouch) and 9 (Block / Special) -->
                    <button class="ctrl-btn btn-3d btn-3d-dark combat-btn" data-key="Digit8,Numpad8" aria-label="Key 8">
                        <span class="combat-digit">8</span>
                    </button>
                    <button class="ctrl-btn btn-3d btn-3d-dark combat-btn" data-key="Digit9,Numpad9" aria-label="Key 9">
                        <span class="combat-digit">9</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Desktop / laptop keyboard legend. Hidden on touch screens. -->
    <aside id="keyboard-hint" aria-label="Keyboard controls">
        <p class="kh-title">Keyboard</p>
        <div class="kh-pads">
            <div class="kh-pad" aria-hidden="true">
                <span></span><kbd>W</kbd><span></span>
                <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
            </div>
            <span class="kh-or">or</span>
            <div class="kh-pad" aria-hidden="true">
                <span></span><kbd>↑</kbd><span></span>

    <script type="module">
        window.addEventListener('error', (e) => console.error("Global Error:", e.message, e.filename, e.lineno, e.error));
        window.addEventListener('unhandledrejection', (e) => console.error("Unhandled Rejection:", e.reason));

        // Telegram Mini App Auto-Ready & Expanded Mode (middle mode)
        function initTelegramWebApp() {
            if (!window.Telegram?.WebApp) return;
            try {
                const tg = window.Telegram.WebApp;
                tg.ready();

                // 1. Expand to maximum height while preserving standard Telegram navigation header
                tg.expand();

                // 2. Disable vertical swipes to prevent pull-to-close dismiss during game taps
                if (typeof tg.disableVerticalSwipes === 'function') {
                    try { tg.disableVerticalSwipes(); } catch (_) {}
                }

                // 3. Lock orientation to portrait if supported
                if (typeof tg.lockOrientation === 'function') {
                    try { tg.lockOrientation('portrait'); } catch (_) {}
                }

                // 4. Immersive theme colors
                try {
                    if (tg.setHeaderColor) tg.setHeaderColor("#08090d");
                    if (tg.setBackgroundColor) tg.setBackgroundColor("#08090d");
                    if (tg.setBottomBarColor) tg.setBottomBarColor("#08090d");
                } catch (_) {}

                // 5. Viewport change safety handler: keep expanded
                tg.onEvent?.('viewportChanged', () => {
                    if (!tg.isExpanded) {
                        try { tg.expand(); } catch (_) {}
                    }
                });

                console.log("Telegram Mini App SDK loaded in Expanded Mode (top navigation header preserved)!");
            } catch (tgErr) {
                console.warn("Telegram WebApp init warning:", tgErr);
            }
        }

        initTelegramWebApp();

        // Safety handler: Ensure expanded on first user gesture without forcing full-screen takeover
        const ensureExpandedOnGesture = () => {
            if (window.Telegram?.WebApp) {
                const tg = window.Telegram.WebApp;
                if (!tg.isExpanded) {
                    try { tg.expand(); } catch (_) {}
                }
            }
        };
        window.addEventListener('pointerdown', ensureExpandedOnGesture, { passive: true });
        window.addEventListener('touchstart', ensureExpandedOnGesture, { passive: true });
        window.addEventListener('click', ensureExpandedOnGesture, { passive: true });

        // Load UMK3 pure JS engine
        const APP_BUILD_HASH = "v20261030_umk3_diagonal_jump_fix";
        import(`./js/main.js?v=${APP_BUILD_HASH}`).catch(err => {
            console.error("Engine Start Error:", err);
            window.__lastErr = err.message + '\n' + err.stack;
        });
    </script>
